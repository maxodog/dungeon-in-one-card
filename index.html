<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060d1a">
<meta name="build" content="ca212101c2">
<title>Dungeon in One Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
/* Plano cianotipo: una carta de una sola tinta azul, la antorcha como único acento.
   Layout: carta centrada con tablero y ficha de monstruos; mandos debajo. */
:root {
  --bg: #060d1a;
  --card: #0d1f3c;
  --tile: #122a4d;
  --line: #7fa8dc;
  --line-dim: rgba(127, 168, 220, .26);
  --chalk: #e6f0fb;
  --muted: #8ea8cb;
  --torch: #ff8b3d;
  --foe: #ff5a78;
  --display: 'Pirata One', 'Times New Roman', serif;
  --body: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --t: 60px;
  --cols: 5;
  --rows: 5;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--chalk); }
body {
  font-family: var(--body); font-size: 18px; line-height: 1.25;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(127,168,220,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(127,168,220,.07) 1px, transparent 1px);
  background-size: 26px 26px;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--torch); outline-offset: 2px; }

.app {
  width: 100%; max-width: 440px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) 14px calc(env(safe-area-inset-bottom) + 22px);
  display: flex; flex-direction: column; gap: 12px;
}

/* ---- cabecera ---- */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.brand { display: flex; flex-direction: column; line-height: .9; }
.brand .mark { font-family: var(--display); font-size: 34px; letter-spacing: .01em; }
.brand .sub { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--torch); font-weight: 600; margin-top: 2px; }
.top-actions { display: flex; gap: 8px; }
.ghost {
  background: transparent; border: 1.5px solid var(--line-dim); border-radius: 6px;
  padding: 7px 12px; min-height: 38px; font-size: 15px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.ghost:hover { border-color: var(--line); color: var(--chalk); }

/* ---- carta ---- */
.card-wrap { perspective: 1400px; }
.card {
  position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: inset 0 0 0 4px var(--card), inset 0 0 0 5px var(--line-dim), 0 18px 40px rgba(0,0,0,.45);
  transform-origin: 50% 50%;
}
.card.flip-out { animation: flipOut .32s ease-in forwards; }
.card.flip-in { animation: flipIn .36s ease-out forwards; }
@keyframes flipOut { to { transform: rotateY(90deg); } }
@keyframes flipIn { from { transform: rotateY(-90deg); } to { transform: rotateY(0); } }

.card-head { display: flex; flex-direction: column; gap: 4px; padding: 2px 6px 0; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lvl-name { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; }
.lvl-num { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lvl-num b { color: var(--torch); font-size: 16px; letter-spacing: .1em; }
.dots { display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border: 1px solid var(--line); transform: rotate(45deg); }
.dots i.done { background: var(--line); }
.dots i.now { background: var(--torch); border-color: var(--torch); }

/* ---- tablero ---- */
.board-box { display: flex; justify-content: center; }
.board { position: relative; width: calc(var(--t) * var(--cols)); height: calc(var(--t) * var(--rows)); border: 1.5px solid var(--line); background: rgba(127,168,220,.04); }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), var(--t)); grid-template-rows: repeat(var(--rows), var(--t)); }
.tile {
  position: relative; width: var(--t); height: var(--t); padding: 0; border: 0; border-radius: 0;
  background: transparent; box-shadow: inset 0 0 0 .5px var(--line-dim); color: var(--chalk);
}
.tile.wall {
  background-color: #1a3a68;
  background-image: repeating-linear-gradient(135deg, rgba(127,168,220,.55) 0 1.5px, transparent 1.5px 7px);
  box-shadow: inset 0 0 0 1.5px var(--line); cursor: default;
}
.tile .stair { position: absolute; inset: 22%; opacity: .55; color: var(--line); }
.tile .stair svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tile.reach { background: rgba(255,139,61,.10); box-shadow: inset 0 0 0 1px rgba(255,139,61,.7); }
.tile.reach::before { content: ''; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; background: var(--torch); transform: rotate(45deg); opacity: .8; }
.tile.reach::after {
  content: attr(data-cost); position: absolute; right: 3px; bottom: 1px; font-size: 12px; font-weight: 700; color: var(--torch);
}
.tile.target { box-shadow: inset 0 0 0 2px var(--foe); background: rgba(255,90,120,.14); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 2px rgba(255,90,120,.35); } }

.tokens { position: absolute; inset: 0; pointer-events: none; }
.token {
  position: absolute; left: 0; top: 0; width: var(--t); height: var(--t);
  transform: translate(calc(var(--x) * var(--t)), calc(var(--y) * var(--t)));
  transition: transform .4s cubic-bezier(.3,.75,.25,1);
  display: grid; place-items: center;
}
.token svg { width: 72%; height: 72%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.token.mon { color: var(--foe); }
.token.pj { color: var(--torch); z-index: 3; }
.token.pj.walking::before { content: ""; position: absolute; left: 10%; top: 10%; width: 80%; height: 80%; border-radius: 50%;
  background: rgba(20,16,12,.55); box-shadow: 0 0 8px 1px rgba(255,139,61,.55), inset 0 0 0 1.5px rgba(255,139,61,.45); }
.herospot { position: absolute; left: 10%; top: 10%; width: 80%; height: 80%; border-radius: 50%; display: grid; place-items: center; pointer-events: none;
  color: var(--torch); background: rgba(20,16,12,.55); box-shadow: 0 0 8px 1px rgba(255,139,61,.55), inset 0 0 0 1.5px rgba(255,139,61,.45); }
.herospot svg { scale: var(--flip, 1) 1; width: 90%; height: 90%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.token.pj svg { position: relative; z-index: 1; }
.token .badge {
  position: absolute; right: 2px; bottom: 2px; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 9px;
  background: var(--card); border: 1.5px solid currentColor; font-size: 13px; font-weight: 700; line-height: 14px; text-align: center; color: var(--chalk);
}
.token.dying { opacity: 0; transform: translate(calc(var(--x) * var(--t)), calc(var(--y) * var(--t))) scale(.4); transition: opacity .35s, transform .35s; }
.token.hit svg { animation: hitflash .5s; }
.token.hurt { animation: shake .45s; }
@keyframes hitflash { 30% { filter: drop-shadow(0 0 8px var(--foe)); stroke-width: 3; } }
@keyframes shake { 20% { translate: -4px 0; } 40% { translate: 4px 0; } 60% { translate: -3px 0; } 80% { translate: 3px 0; } }
.float {
  position: absolute; z-index: 5; width: var(--t); text-align: center; font-weight: 700; font-size: 22px;
  left: calc(var(--x) * var(--t)); top: calc(var(--y) * var(--t)); animation: floatup .9s ease-out forwards; pointer-events: none;
  text-shadow: 0 1px 0 var(--card), 0 0 6px var(--card);
}
.float.dmg { color: var(--foe); } .float.good { color: var(--chalk); }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }

/* ---- ficha de monstruos (pie de la carta) ---- */
.foot { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 10px; border-top: 1.5px solid var(--line-dim); padding: 10px 4px 2px; }
.foot .ico { width: 54px; height: 54px; color: var(--foe); border: 1.5px solid var(--line-dim); border-radius: 8px; display: grid; place-items: center; position: relative; }
.foot .ico svg { width: 70%; height: 70%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.foot .nm { font-family: var(--display); font-size: 22px; line-height: 1; }
.foot .nm small { font-family: var(--body); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-left: 6px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
.stats div { text-align: center; border: 1px solid var(--line-dim); border-radius: 5px; padding: 2px 0 1px; }
.stats b { display: block; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.stats span { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---- panel de mando ---- */
.panel { display: flex; flex-direction: column; gap: 10px; }
.banner { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.step { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 1.5px solid var(--torch); color: var(--torch); border-radius: 50%; font-weight: 700; font-size: 16px; }
.banner p { margin: 0; font-size: 17px; color: var(--chalk); }
.banner p em { font-style: normal; color: var(--torch); font-weight: 700; }

.hp-row { display: flex; align-items: center; gap: 10px; }
.hp-row .lab { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); font-weight: 600; width: 44px; }
.pips { display: flex; gap: 7px; }
.pips i { width: 14px; height: 14px; transform: rotate(45deg); border: 1.5px solid var(--torch); transition: background .25s; }
.pips i.on { background: var(--torch); }
.pips i.lost { animation: pip .5s; }
@keyframes pip { 40% { background: var(--foe); border-color: var(--foe); } }
.hpnum { margin-left: auto; font-size: 15px; color: var(--muted); font-weight: 600; }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-height: 74px; padding: 6px 4px; background: rgba(127,168,220,.06); border: 1.5px solid var(--line-dim); border-radius: 9px; text-align: center;
}
.chip .lbl { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chip .val { font-size: 32px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip .sub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; min-height: 18px; font-weight: 500; }
.chip.slot { border-style: dashed; border-color: var(--line); }
.chip.slot.filled { border-style: solid; border-color: var(--torch); background: rgba(255,139,61,.08); }
.chip.armed { animation: arm 1s ease-in-out infinite; }
@keyframes arm { 50% { border-color: var(--torch); background: rgba(255,139,61,.10); } }
.chip .bar { position: absolute; left: 8px; right: 8px; bottom: 4px; height: 3px; background: var(--line-dim); border-radius: 2px; overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--torch); transition: width .3s; }

.die { position: relative; width: 48px; height: 48px; flex: none; padding: 7px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); background: var(--chalk); border: 0; border-radius: 10px; box-shadow: 0 3px 0 #9bb6d6; transition: transform .15s; }
.die i { border-radius: 50%; background: transparent; margin: 14%; }
.die i.on { background: var(--card); }
.die.sel { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--torch), 0 6px 0 #9bb6d6; }
.die.used { opacity: .25; pointer-events: none; }
.die.mini { width: 20px; height: 20px; padding: 3px; border-radius: 4px; box-shadow: none; }
.die.mini i { margin: 8%; }
.die.rolling { animation: tumble .12s linear infinite; }
@keyframes tumble { 25% { transform: rotate(-8deg) translateY(-2px); } 75% { transform: rotate(8deg) translateY(1px); } }
.dice-row { display: flex; gap: 14px; justify-content: center; min-height: 56px; align-items: center; }
.dice-row .hint { color: var(--muted); font-size: 15px; }

.actions { display: flex; gap: 8px; }
.btn {
  flex: 1; min-height: 50px; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 9px; background: transparent;
  font-weight: 700; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk);
}
.btn.primary { background: var(--torch); border-color: var(--torch); color: #1a0d03; }
.btn.small { flex: none; padding: 8px 16px; font-size: 17px; letter-spacing: .06em; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.pulse:not(:disabled) { animation: arm 1s ease-in-out infinite; }
.log { margin: 0; min-height: 40px; color: var(--muted); font-size: 16px; }
.log b { color: var(--chalk); font-weight: 600; }

/* ---- hojas y diálogos ---- */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(3,8,18,.78); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.sheet {
  width: 100%; max-width: 440px; max-height: 88%; overflow: auto; background: var(--card); border: 1.5px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0;
  padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px); display: flex; flex-direction: column; gap: 12px;
  animation: rise .28s ease-out;
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; }
.sheet p { margin: 0; color: var(--chalk); }
.sheet .lead { color: var(--muted); }
.sheet h4 { margin: 6px 0 0; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--torch); font-weight: 700; }
.sheet ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.sheet .fine { font-size: 14px; color: var(--muted); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 64px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: rgba(127,168,220,.06); text-align: left; }
.choice b { font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.choice span { font-size: 15px; color: var(--muted); }
.choice span em { font-style: normal; color: var(--torch); font-weight: 700; }
.choice.wide { grid-column: 1 / -1; border-color: var(--torch); }
.choice:disabled { opacity: .4; }

@media (max-width: 360px) {
  .brand .mark { font-size: 29px; } .chip .val { font-size: 28px; } .die { width: 44px; height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

.btn.mini { flex: none; min-height: 44px; padding: 6px 12px; font-size: 16px; letter-spacing: .05em; }
.actions .btn.mini { flex: 1; }
.sheet > * { flex-shrink: 0; }
.btn.abil { border-color: var(--torch); color: var(--torch); background: rgba(255,139,61,.08); }
.chip.locked::after { content: 'fijo'; position: absolute; top: 3px; right: 6px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.die.locked { box-shadow: 0 0 0 3px var(--line), 0 3px 0 #9bb6d6; }
.hp-row .lab { width: auto; min-width: 44px; color: var(--torch); }

/* ---- pantallas de inicio ---- */
.screen { display: none; }
body.menu .app { display: none; }
body.menu .screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100dvh; padding: max(18px, env(safe-area-inset-top)) 16px calc(env(safe-area-inset-bottom) + 22px);
}
.splash { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
.splash .logo { display: flex; flex-direction: column; line-height: .85; margin-bottom: 2px; }
.splash .logo .mark { font-family: var(--display); font-size: 68px; }
.splash .logo .sub { font-size: 16px; letter-spacing: .4em; text-transform: uppercase; color: var(--torch); font-weight: 600; margin-top: 6px; }
.tagline { margin: 0; color: var(--muted); font-size: 19px; }
.splash .lead { margin: 0; color: var(--muted); }
.splash .fine { margin: 0; font-size: 14px; color: var(--muted); }
.menu-btns { display: flex; flex-direction: column; gap: 10px; margin: 6px 0; }
.menu-btns .btn, .menu-main { flex: none; min-height: 60px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; text-align: left; }
.menu-main small { font-size: 14px; letter-spacing: .08em; opacity: .75; font-weight: 600; }
.menu-btns .ghost { align-self: flex-start; }
.screen-h { margin: 0; font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; }
.back { align-self: flex-start; }
.hero-list { display: flex; flex-direction: column; gap: 10px; }
.hero-card { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; text-align: left; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: rgba(127,168,220,.06); }
.hero-card:active, .hero-card:hover { border-color: var(--torch); background: rgba(255,139,61,.08); }
.hero-card .ico { width: 58px; height: 58px; color: var(--torch); border: 1.5px solid var(--line-dim); border-radius: 10px; display: grid; place-items: center; }
.hero-card .ico svg { width: 68%; height: 68%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.hero-card b { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; }
.hero-card p { margin: 3px 0 0; color: var(--muted); font-size: 16px; line-height: 1.2; }
.pw {
  width: 100%; text-align: center; text-transform: uppercase; letter-spacing: .35em; padding: 12px 0 12px .35em;
  background: rgba(127,168,220,.06); border: 1.5px solid var(--line); border-radius: 10px; color: var(--chalk);
  font: 700 44px/1.1 ui-monospace, Menlo, Consolas, monospace;
}
.pw::placeholder { color: var(--line-dim); }
.pw:focus-visible { outline: 2px solid var(--torch); outline-offset: 2px; }
.err { margin: 0; min-height: 22px; color: var(--foe); font-size: 16px; }
.pwshow { display: flex; gap: 8px; justify-content: center; }
.pwshow span { width: 58px; height: 76px; display: grid; place-items: center; border: 1.5px solid var(--torch); border-radius: 10px; background: rgba(255,139,61,.08); color: var(--torch); font: 700 42px/1 ui-monospace, Menlo, Consolas, monospace; }
@media (max-width: 380px) {
  .pwshow span { width: 50px; height: 68px; font-size: 36px; }
}

/* cabecera compacta: marca y dos botones en una sola línea */
.top { flex-wrap: nowrap; }
.brand { flex: none; }
.brand .mark { font-size: 31px; }
.brand .sub { white-space: nowrap; letter-spacing: .2em; font-size: 12px; }
.top-actions { gap: 6px; min-width: 0; }
.top-actions .ghost { padding: 7px 10px; font-size: 14px; letter-spacing: .05em; min-height: 36px; }

/* ---- animaciones al moverse ---- */
.token svg { scale: var(--flip, 1) 1; }
.token.walking svg { animation: walk .5s ease-in-out infinite; transform-origin: 50% 85%; }
.token.pj.walking svg { animation: walk .21s ease-in-out infinite; }
.token.k-spider.walking svg { animation: skitter .24s linear infinite; }
.token.k-skeleton.walking svg { animation: clatter .45s ease-in-out infinite; }
.token.k-orc.walking svg { animation: stomp .9s ease-in-out infinite; }
.token.k-demon.walking svg { animation: hover 1.1s ease-in-out infinite; }
@keyframes walk { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-12%) rotate(-5deg); } 50% { transform: translateY(0) rotate(0); } 75% { transform: translateY(-12%) rotate(5deg); } }
@keyframes skitter { 0%,100% { transform: translate(0,0) scaleY(1); } 25% { transform: translate(-4%,3%) scaleY(.94); } 50% { transform: translate(3%,-2%) scaleY(1.04); } 75% { transform: translate(-3%,-3%) scaleY(.97); } }
@keyframes clatter { 0%,100% { transform: translateY(0) rotate(-8deg); } 25% { transform: translateY(-8%) rotate(0); } 50% { transform: translateY(0) rotate(8deg); } 75% { transform: translateY(-8%) rotate(0); } }
@keyframes stomp { 0%,100% { transform: translateY(0) scale(1.08,.92); } 35% { transform: translateY(-16%) scale(.96,1.06); } 60% { transform: translateY(0) scale(1.08,.92); } }
@keyframes hover { 0%,100% { transform: translateY(-3%) scale(1); } 50% { transform: translateY(-14%) scale(1.05); } }
.token.pj.walking { z-index: 4; }

/* ---- texto flotante: BLOCK con el mismo tamaño y sitio que el daño ---- */
.float { display: flex; justify-content: center; white-space: nowrap; }
.float.block { color: var(--line); }
.token.blocked svg { animation: guard .6s ease-out; }
@keyframes guard { 0% { filter: drop-shadow(0 0 0 rgba(127,168,220,0)); } 30% { filter: drop-shadow(0 0 9px #7fa8dc); } 100% { filter: none; } }

/* ---- Montaña Eterna: ventiscas, huecos y nuevos monstruos ---- */
.tile.blizz { background: linear-gradient(135deg, rgba(190,225,255,.16), rgba(190,225,255,.05)); }
.tile.blizz .wind { position: absolute; inset: 16%; color: #bfe3ff; opacity: .5; pointer-events: none; }
.tile.blizz .wind svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile.blizz.reach { background: rgba(255,139,61,.10); }
.tile.wall.void { background: #03070f; background-image: none; box-shadow: inset 0 0 0 1px rgba(127,168,220,.12); }
.chip.chilled .val { color: #9fd8ff; }
.chip.chilled .sub { color: #9fd8ff; }
.token.k-wolf.walking svg { animation: skitter .3s linear infinite; }
.token.k-yeti.walking svg { animation: stomp .9s ease-in-out infinite; }
.token.k-sorcerer.walking svg { animation: hover 1.1s ease-in-out infinite; }
.token.k-goblin.walking svg { animation: clatter .4s ease-in-out infinite; }

/* ---- objetos ---- */
.items { display: flex; flex-wrap: wrap; gap: 8px; }
.items[hidden] { display: none; }
.item { flex: 1 1 0; min-width: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 8px;
  border: 1.5px solid var(--torch); border-radius: 9px; background: rgba(255,139,61,.08); color: var(--chalk); font-size: 15px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.item .ico { width: 24px; height: 24px; flex: none; color: var(--torch); display: grid; place-items: center; }
.item .ico svg, .item-head .ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.item.idle { border-color: var(--line-dim); background: rgba(127,168,220,.05); color: var(--muted); }
.item.idle .ico { color: var(--muted); }
.item.on { border-color: #9fd8ff; background: rgba(159,216,255,.10); color: #9fd8ff; cursor: default; }
.item.on .ico { color: #9fd8ff; }
.item-head { display: flex; align-items: center; gap: 12px; }
.item-head .ico { width: 46px; height: 46px; flex: none; color: var(--torch); border: 1.5px solid var(--line-dim); border-radius: 10px; padding: 8px; }
.dice-row.pick { min-height: 64px; }

/* ---- botón de habilidad en la fase de movimiento ---- */
.btn.abil.tight { font-size: 15px; letter-spacing: .03em; padding: 6px 8px; line-height: 1.05; }
.btn.abil.on { background: var(--torch); color: #1a0d03; }
.actions .btn.small { padding: 8px 12px; }

/* ---- selector de aventura ---- */
.adv-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.adv-card { display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: left; padding: 8px 8px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: rgba(127,168,220,.06); }
.adv-card:active, .adv-card:hover { border-color: var(--torch); background: rgba(255,139,61,.08); }
.adv-card img { width: 100%; height: auto; aspect-ratio: 440 / 614; border-radius: 6px; display: block; background: var(--card); object-fit: cover; margin-bottom: 4px; }
.adv-tag { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--torch); font-weight: 700; }
.adv-card b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; }
.adv-card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.2; }

/* ---- elección de objetos ---- */
.item-card { position: relative; grid-template-columns: 58px 1fr 26px; }
.item-card .tick { width: 22px; height: 22px; border: 1.5px solid var(--line); border-radius: 50%; align-self: center; position: relative; }
.item-card.chosen { border-color: var(--torch); background: rgba(255,139,61,.10); }
.item-card.chosen .tick { background: var(--torch); border-color: var(--torch); }
.item-card.chosen .tick::after { content: ''; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px; border: solid #1a0d03; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.item-card b { font-size: 24px; }
.item { font-size: 13.5px; letter-spacing: .02em; padding: 4px 6px; gap: 4px; overflow: hidden; white-space: nowrap; }
.item .ico { width: 20px; height: 20px; }

/* ===== Expansiones: agua, cofre, jefes, botín, héroes por caja ===== */
.tile.water { background: linear-gradient(180deg, rgba(80,170,255,.20), rgba(80,170,255,.07)); }
.tile.water .wave { position: absolute; inset: 14%; color: #7cc4ff; opacity: .55; pointer-events: none; }
.tile.water .wave svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile.water.reach { background: rgba(255,139,61,.10); }
.tile .chest { position: absolute; inset: 10%; color: #ffd36b; pointer-events: none; display: grid; place-items: center; }
.tile .chest svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(255,211,107,.45)); }
.tile .chest em { position: absolute; right: -3px; top: -3px; min-width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 1.5px solid #ffd36b; font-style: normal; font-size: 13px; font-weight: 700; line-height: 15px; text-align: center; color: var(--chalk); }
.tile .chest.open { opacity: .3; filter: grayscale(.6); }
.tile .chest.open em { display: none; }
.tile.target .chest { color: var(--foe); }
.token.wet .badge { border-color: #7cc4ff; box-shadow: 0 0 0 1px #7cc4ff; }
.token.wet svg { filter: drop-shadow(0 0 5px rgba(124,196,255,.6)); }
.stats b + u { position: absolute; top: 0; right: 3px; font-size: 11px; font-weight: 700; text-decoration: none; color: #7cc4ff; }
.stats div { position: relative; }
.wnote { margin-top: 4px; font-size: 13px; color: #7cc4ff; }
.dots i.boss { border-radius: 50%; transform: none; border-color: var(--foe); }
.dots i.boss.done { background: var(--foe); } .dots i.boss.now { background: var(--torch); border-color: var(--torch); }
.dots { flex-wrap: wrap; justify-content: flex-end; max-width: 62%; gap: 4px; }
.die.num { display: grid; place-items: center; grid-template: none; padding: 0; }
.die.num b { font-size: 24px; line-height: 1; color: var(--card); }
.die.num small { position: absolute; bottom: 2px; font-size: 9px; letter-spacing: .1em; color: #6b86ad; font-weight: 700; }
.die.num.mini { width: 24px; } .die.num.mini b { font-size: 13px; } .die.num.mini small { display: none; }
.chip .lootn { color: #ffd36b; font-weight: 700; }
.loot { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1.5px solid rgba(255,211,107,.5); border-radius: 9px; background: rgba(255,211,107,.07); }
.loot[hidden] { display: none; }
.loot .ico { width: 24px; height: 24px; flex: none; color: #ffd36b; }
.loot .ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.loot .txt { flex: 1; font-size: 15px; color: var(--chalk); } .loot .txt b { color: #ffd36b; }
.item-head .ico.boss { color: var(--foe); }
.item-head .ico.boss svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.boss-stats { margin: 8px 0; }
.choice.chosen { border-color: var(--torch); background: rgba(255,139,61,.10); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 10px 0; }
.stepper b { font-size: 30px; min-width: 30px; text-align: center; }
.pack-h { margin: 8px 0 -2px; font-family: var(--body); font-weight: 600; font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: var(--torch); }
.hero-card .pk { display: inline-block; margin-top: 3px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--line); }

/* ===== La Puerta del Infierno ===== */
.tile.damned { background: radial-gradient(circle at 50% 55%, rgba(255,70,50,.28), rgba(150,20,40,.10) 70%); }
.tile.damned .curse { position: absolute; inset: 16%; color: #ff6b57; opacity: .6; pointer-events: none; }
.tile.damned .curse svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile.damned.reach { background: rgba(255,139,61,.14); }
.tile .gem { position: absolute; inset: 8%; color: #e0a0ff; pointer-events: none; display: grid; place-items: center; }
.tile .gem svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(200,110,255,.55)); }

.wnote.hell { color: #ff9a8a; }
.wnote.hell.on { color: #ff5a46; font-weight: 700; }
.wnote.hell.off { color: #9fd8ff; }

/* ===== Disposición compacta: mapa y mandos en la misma pantalla ===== */
.app { min-height: 100vh; min-height: 100dvh; gap: 8px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }

/* pantallas de inicio en escritorio */
@media (min-width: 1000px) and (min-aspect-ratio: 3/2) {
  body.menu { background-image: linear-gradient(rgba(4,8,18,.84), rgba(4,8,18,.84)), url(img/playmat.jpg); background-size: cover; background-attachment: fixed; background-position: center; }

  .splash.wide .adv-list { grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .splash.wide .hero-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .splash.wide .screen-h { font-size: 52px; }
}

.updbar { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 14px; background: var(--card); border: 1.5px solid var(--torch); border-radius: 10px; font-size: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.updbar .btn { flex: none; min-height: 38px; background: var(--torch); border-color: var(--torch); color: #1a0d03; }

/* ---- botón de sonido ---- */
#btnSnd .off { display: none; }
#btnSnd.muted .off { display: inline; }
#btnSnd.muted .on { display: none; }
#btnSnd.muted { color: var(--muted); }

/* ---- cabecera en pantallas estrechas (360–400 px): caben título, vida y tres botones ---- */
@media (max-width: 420px) {
  .top { gap: 5px; }
  .brand .mark { font-size: 21px; }
  .top .hp-row { gap: 4px; }
  .top .pips { gap: 3px; }
  .top .pips i { width: 9px; height: 9px; border-width: 1.2px; }
  .top .hpnum { font-size: 12px; }
  .top-actions { gap: 4px; }
  .top-actions .ghost.icon { min-width: 30px; width: 30px; min-height: 32px; }
}

/* escritorio: con el botón de sonido, los cuatro botones del cuadro del título deben dejar sitio al crédito */
@media (min-width: 1000px) and (min-aspect-ratio: 3/2) {
  .app .sysbox .btn { min-height: 0; height: calc(112 * var(--u)); padding-top: 0; padding-bottom: 0; }
}

/* ---- panel de sonido ---- */
.sheet .opt { display: flex; align-items: center; gap: 12px; padding: 12px 4px; font-size: 17px; }
.sheet .opt input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--torch); flex: none; }
.sheet .opt.vol { flex-direction: column; align-items: stretch; gap: 6px; }
.sheet .opt.vol input[type=range] { width: 100%; accent-color: var(--torch); }
.sheet .small { font-size: 13px; color: var(--muted); margin: 4px 4px 14px; }

<body>
<div class="screen" id="screen"></div>
<main class="app">
  <header class="top">
    <div class="brand"><span class="mark">Dungeon</span><span class="sub">in one card</span></div>
    <div class="hp-row"><span class="lab" id="heroTag"></span><div class="pips" id="pips"></div><span class="hpnum" id="hpnum"></span></div>
    <div class="top-actions">
      <button type="button" class="ghost icon" id="btnSnd" aria-label="Sonido" title="Sonido"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.500v5h4l5 4v-13l-5 4z"/><path class="on" d="M16.500 9a4 4 0 0 1 0 6M19 6.500a8 8 0 0 1 0 11"/><path class="off" d="M16 9.500l5 5M21 9.500l-5 5"/></svg></button>
      <button type="button" class="ghost icon" id="btnRules" aria-label="Reglas" title="Reglas">?</button>
      <button type="button" class="ghost icon" id="btnPass" aria-label="Contraseña" title="Contraseña"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v4M20 12v3"/></svg></button>
    </div>
  </header>

  <section class="card-wrap">
    <article class="card" id="card">
      <div class="card-head">
        <div class="head-row">
          <div class="lvl-num">Nivel <b id="lvlNum">1</b> de <span id="lvlTot">12</span></div>
          <div class="dots" id="dots" aria-hidden="true"></div>
        </div>
        <h2 class="lvl-name" id="lvlName">Sótano de telarañas</h2>
      </div>
      <div class="board-box" id="boxBoard">
        <div class="board" id="board">
          <div class="grid" id="grid"></div>
          <div class="tokens" id="tokens"></div>
        </div>
      </div>
      <div class="foot" id="foot"></div>
    </article>
  </section>

  <aside class="herobox" id="heroBox" aria-label="Tu aventurero"></aside>
  <aside class="sysbox" id="sysBox">
    <div class="brand"><span class="mark">Dungeon</span><span class="sub">in one card</span></div>
    <button type="button" class="btn" data-act="rules">Reglas</button>
    <button type="button" class="btn" data-act="pass">Contraseña</button>
    <button type="button" class="btn" data-act="snd" id="sndBtnD">Sonido</button>
    <button type="button" class="btn" data-act="menu">Menú</button>
    <p class="fine">Versión no oficial de One Card Dungeon, de Barny Skinner. Portadas y tapete © Little Rocket Games.</p>
  </aside>

  <section class="panel" aria-label="Mandos">
    <div class="banner"><span class="step" id="step">1</span><p id="bannerText"></p></div>
    <div class="chips" id="chips"></div>
    <div class="items" id="items" hidden></div>
    <div class="loot" id="loot" hidden></div>
    <div class="dice-row" id="diceRow"></div>
    <div class="actions" id="actions"></div>
    <p class="log" id="log" aria-live="polite"></p>
  </section>
</main>

function buildLevel(def, O, opts) {
  opts = opts || {};
  const walls = new Array(N).fill(false), blizz = new Array(N).fill(false), voids = new Array(N).fill(false), water = new Array(N).fill(false), damned = new Array(N).fill(false);
  const stairs = [];
  let start = -1, chestAt = -1, stoneAt = -1;
  O.map.forEach((row, y) => {
    for (let x = 0; x < COLS; x++) {
      const c = row[x], i = idx(x, y);
      if (c === '#') walls[i] = true;
      else if (c === 'V') { walls[i] = true; voids[i] = true; }   // hueco de la carta (cubierto por la ilustración)
      else if (c === '~') blizz[i] = true;
      else if (c === 'W') water[i] = true;
      else if (c === 'D') damned[i] = true;                       // casilla maldita (La Puerta del Infierno)
      else if (c === 'T') { walls[i] = true; stoneAt = i; }       // muro con la Piedra de la Perdición
      else if (c === 'X') chestAt = i;                            // casilla del cofre (X de la carta)
      else if (c === 'Z') { chestAt = i; water[i] = true; }       // cofre sobre una casilla de agua
      else if (c === 'S') { start = i; stairs.push(i); }
      else if (c === 'U') stairs.push(i);
    }
  });
  if (opts.chestOnExit) chestAt = stairs.find(i => i !== start);  // M'Guf-yn: en la escalera opuesta a la de entrada
  if (opts.noChest) chestAt = -1;
  const spawns = def.at.map(([x, y]) => idx(x, y));
  return { title: def.title, mon: O.mon, map: O.map, walls, blizz, voids, water, damned, stoneAt, start, stairs, spawns, chestAt,
           boss: def.boss || 0, num: def.num || 0, rd: {}, lm: {} };
}

/* ---------- Caminos y distancias ---------- */
function neighbors(lv, i, cut) {
  const [x, y] = XY(i), out = [];
  for (const [dx, dy, c] of DIRS) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
    const j = idx(nx, ny);
    if (lv.walls[j]) continue;
    // Una diagonal "corta la esquina": queda cerrada si las dos casillas contiguas (la horizontal y la
    // vertical) son impasables. Los muros siempre lo son; para los monstruos también el aventurero (cut).
    // Otros monstruos no cierran el paso.
    if (c === 3) {
      const h = idx(x + dx, y), v = idx(x, y + dy);
      if ((lv.walls[h] || (cut && cut[h])) && (lv.walls[v] || (cut && cut[v]))) continue;
    }
    out.push([j, c]);
  }
  return out;
}

function dijkstra(lv, src, blocked, cut) {
  const dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), done = new Array(N).fill(false);
  dist[src] = 0;
  for (;;) {
    let u = -1, b = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < b) { b = dist[i]; u = i; }
    if (u < 0) break;
    done[u] = true;
    for (const [v, c] of neighbors(lv, u, cut)) {
      if (blocked && blocked[v]) continue;
      if (b + c < dist[v]) { dist[v] = b + c; prev[v] = u; }
    }
  }
  return { dist, prev };
}

// Distancia de Alcance: menor coste de Movimiento entre dos casillas (solo los muros estorban)
function rangeDist(lv, a, b) {
  let d = lv.rd[a];
  if (!d) d = lv.rd[a] = dijkstra(lv, a, null).dist;
  return d[b];
}

/* ---------- Línea de visión ---------- */
// ¿El segmento comparte longitud positiva con la casilla cerrada (sx,sy)?
// Línea de visión: el segmento puede salir de cualquier punto de la casilla de origen y llegar a
// cualquier punto de la casilla de destino. Un muro u otro monstruo lo bloquea aunque lo roce solo
// con una esquina o un borde (un único punto): el cuadrado se trata como cerrado.
const LOS_PTS = [0.02, 0.2, 0.5, 0.8, 0.98];

function segTouches(ax, ay, bx, by, sx, sy) {
  const dx = bx - ax, dy = by - ay;
  let lo = 0, hi = 1;
  if (dx === 0) { if (ax < sx || ax > sx + 1) return false; }
  else {
    let t1 = (sx - ax) / dx, t2 = (sx + 1 - ax) / dx;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    lo = Math.max(lo, t1); hi = Math.min(hi, t2);
  }
  if (dy === 0) { if (ay < sy || ay > sy + 1) return false; }
  else {
    let t1 = (sy - ay) / dy, t2 = (sy + 1 - ay) / dy;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    lo = Math.max(lo, t1); hi = Math.min(hi, t2);
  }
  return hi - lo >= -1e-9;
}

// Segmentos de a a b que no tocan ningún muro (lista plana p,q,r,s,...)
function losSegs(lv, a, b) {
  const key = a * N + b;
  if (lv.lm[key] !== undefined) return lv.lm[key];
  const [ax, ay] = XY(a), [bx, by] = XY(b), walls = [], out = [];
  for (let w = 0; w < N; w++) if (lv.walls[w] && w !== a && w !== b) walls.push(XY(w));
  for (const u of LOS_PTS) for (const v of LOS_PTS) for (const x of LOS_PTS) for (const y of LOS_PTS) {
    const p = ax + u, q = ay + v, r = bx + x, s = by + y;
    let ok = true;
    for (const [wx, wy] of walls) if (segTouches(p, q, r, s, wx, wy)) { ok = false; break; }
    if (ok) out.push(p, q, r, s);
  }
  lv.lm[key] = out;
  return out;
}

function hasLOS(lv, a, b, blockers) {
  if (a === b) return true;
  const segs = losSegs(lv, a, b);
  if (!segs.length) return false;
  const bl = blockers.filter(t => t !== a && t !== b).map(XY);
  if (!bl.length) return true;
  for (let k = 0; k < segs.length; k += 4) {
    let ok = true;
    for (const [tx, ty] of bl) if (segTouches(segs[k], segs[k + 1], segs[k + 2], segs[k + 3], tx, ty)) { ok = false; break; }
    if (ok) return true;
  }
  return false;
}

const NO_BONUS = {};
function monBonus(st, m, tile) {

}

function usedCount(t) {
  let c = 0;
  for (const k of ['spd', 'atk', 'def', 'rng']) { if (t.assign[k] >= 0) c++; if (t.assign2 && t.assign2[k] >= 0) c++; }
  return c;
}
function assignComplete(t) {
  if (!t.dice) return false;
  if (t.knight) return usedCount(t) === 3;
  return (t.ranger ? t.assign.rng : t.assign.spd) >= 0 && t.assign.atk >= 0 && t.assign.def >= 0;
}

function confirmEnergy(st) {

    + (t.loot && t.loot.k === k ? t.loot.n : 0);
  t.spd = a.spd + d('spd'); t.atk = a.atk + d('atk'); t.def = a.def + d('def'); t.rng = a.rng + d('rng');
  t.spdLeft = t.spd; t.atkLeft = t.atk;

  const pv = {};

  st.prev = pv;

}

// Botín del cofre: puntos de un solo dado que se suman a UNA habilidad por turno
function setLoot(st, k, n) {
  const t = st.turn;
  if (!k || n <= 0) { t.loot = { k: null, n: 0 }; return true; }
  if (!['spd', 'atk', 'def', 'rng'].includes(k) || n > st.loot) return false;
  t.loot = { k, n };
  return true;
}

/* ---------- Dados y habilidades de héroe ---------- */
// Clérigo: con tres dados iguales (3-3-3) cada uno sube 2 (máximo 6)
function heroDice(st, dice) {

function toggleRanger(st) {

}

}
function useRogue(st) {       // Pícaro: +1 a todos los dados

}
function toggleSherpa(st) {

}
function toggleCorsair(st) {  // Corsario: a cualquier casilla libre, sin gastar Movimiento

function abilityInfo(st) {

    if (h === 'corsair') return (!st.abil || st.corsairOn) ? { id: 'corsair', label: st.corsairOn ? 'Cancelar abordaje' : 'Abordaje' } : null;
    if (h === 'necromancer') return !st.abil && st.adv.hp > 1 && st.mons.length ? { id: 'necro', label: 'Sacrificio −1 Vida' } : null;
    if (h === 'demonhunter') return !st.abil && st.mons.length ? { id: 'demon', label: 'Mover monstruo' } : null;

/* ---------- Fase del aventurero ---------- */
function reachFromAdv(st) {
  const lv = lvOf(st), src = idx(st.adv.x, st.adv.y);
  const blocked = new Array(N).fill(false);
  for (const m of st.mons) blocked[idx(m.x, m.y)] = true;
  if (st.corsairOn) {
    const dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1);
    for (let i = 0; i < N; i++) if (i !== src && !lv.walls[i] && !blocked[i]) { dist[i] = 1; prev[i] = src; }
    return { dist, prev, free: true };
  }
  if (st.sherpaOn) {
    // Sherpa: los muros cuentan como casillas normales al moverse, pero no se puede terminar en uno
    const R = dijkstra({ walls: lv.voids }, src, blocked);
    for (let i = 0; i < N; i++) if (lv.walls[i]) R.dist[i] = Infinity;
    return R;
  }
  return dijkstra(lv, src, blocked);
}

// Ventisca: con el aventurero sobre una casilla de ventisca, -1 al Ataque y a la Defensa base
function blizzPen(st) {
  const lv = LEVELS[st.levelIdx];
  return lv.blizz[idx(st.adv.x, st.adv.y)] && !st.cloak ? 1 : 0;
}
const atkAvail = st => Math.max(0, st.turn.atkLeft - blizzPen(st));
const heroDef = st => Math.max(1, st.turn.def - blizzPen(st));

function attackInfo(st, m) {
  const lv = lvOf(st), a = idx(st.adv.x, st.adv.y), t = idx(m.x, m.y);
  const rd = rangeDist(lv, a, t);
  if (rd > (st.turn.rng || st.adv.rng)) return { ok: false, why: 'range', rd };
  const others = st.mons.filter(o => o !== m).map(o => idx(o.x, o.y));
  if (!hasLOS(lv, a, t, others)) return { ok: false, why: 'los', rd };
  if (atkAvail(st) < mStat(st, m, 'def')) return { ok: false, why: 'points', rd };
  return { ok: true, rd };
}

// Cofre del tesoro: se ataca como un monstruo; sus puntos son su Defensa y su botín
function chestInfo(st) {
  if (!chestClosed(st)) return { ok: false, why: 'none' };
  const a = idx(st.adv.x, st.adv.y), t = st.chest.at;
  const rd = rangeDist(LEVELS[st.levelIdx], a, t);
  if (rd > (st.turn.rng || st.adv.rng)) return { ok: false, why: 'range', rd };
  if (!hasLOS(lvOf(st), a, t, st.mons.map(o => idx(o.x, o.y)))) return { ok: false, why: 'los', rd };
  if (atkAvail(st) < st.chest.val) return { ok: false, why: 'points', rd };
  return { ok: true, rd };
}
function openChest(st) {
  pushUndo(st);
  st.turn.atkLeft -= st.chest.val;
  st.chest.open = true;
  st.loot += st.chest.val;
}

// Piedra de la Perdición: se ataca como un monstruo (su dado D4 es su Defensa). Al romperla, 1 de daño a todos los
// monstruos y 1 a tu aventurero (con el Puño de hierro, 2 a los monstruos).
function stoneInfo(st) {
  if (!st.stone || st.stone.broken) return { ok: false, why: 'none' };
  const lv = LEVELS[st.levelIdx], a = idx(st.adv.x, st.adv.y), t = st.stone.at;
  if (!lv.ns) { const w = lv.walls.slice(); w[t] = false; lv.ns = Object.assign({}, lv, { walls: w, rd: {}, lm: {}, ns: null, cv: null }); }
  const rd = rangeDist(lv.ns, a, t);
  if (rd > (st.turn.rng || st.adv.rng)) return { ok: false, why: 'range', rd };
  if (!hasLOS(lvOf(st), a, t, st.mons.map(o => idx(o.x, o.y)))) return { ok: false, why: 'los', rd };
  if (atkAvail(st) < st.stone.val) return { ok: false, why: 'points', rd };
  return { ok: true, rd };
}
function breakStone(st) {
  pushUndo(st);
  const dmg = st.fist ? 2 : 1;
  st.turn.atkLeft -= st.stone.val;
  st.stone.broken = true; st.fist = false;
  for (const m of st.mons) m.hp -= dmg;
  st.mons = st.mons.filter(m => m.hp > 0);
  st.adv.hp = Math.max(0, st.adv.hp - 1);
  return reviveIfDead(st);
}
// Colgante de alma: al caer a 0 de Vida, vuelves con 1 (una sola vez)
function reviveIfDead(st) {
  if (st.adv.hp <= 0 && st.items && st.items.includes('pendant')) { st.adv.hp = 1; st.items = st.items.filter(i => i !== 'pendant'); st.revived = true; }
  return st.adv.hp > 0;
}

// Corona de laurel: tras tu fase, ordenas a un monstruo que se mueva y/o ataque a otros monstruos con sus propias cifras
function laurelStart(st, m) {
  st.laurel = { id: m.id, spdLeft: mStat(st, m, 'spd'), atkLeft: mStat(st, m, 'atk') };
  st.undo = [];
}
function laurelMon(st) { return st.laurel ? st.mons.find(o => o.id === st.laurel.id) : null; }
function laurelReach(st) {
  const m = laurelMon(st), lv = lvOf(st), advI = idx(st.adv.x, st.adv.y), me = idx(m.x, m.y);
  const bl = new Array(N).fill(false); bl[advI] = true;

  return dijkstra(lv, me, bl, bl);
}
function laurelMove(st, i) {
  const m = laurelMon(st), R = laurelReach(st);
  if (!(R.dist[i] > 0 && R.dist[i] <= st.laurel.spdLeft)) return null;
  const path = [];
  for (let c = i; c !== -1; c = R.prev[c]) path.push(c);
  path.reverse();
  st.laurel.spdLeft -= R.dist[i];
  const [x, y] = XY(i); m.x = x; m.y = y;
  return path;
}
function laurelAttackInfo(st, t) {
  const m = laurelMon(st), lv = lvOf(st), a = idx(m.x, m.y), b = idx(t.x, t.y);
  if (t === m) return { ok: false, why: 'self' };
  const rd = rangeDist(lv, a, b);
  if (rd > mStat(st, m, 'rng')) return { ok: false, why: 'range', rd };
  const others = st.mons.filter(o => o !== m && o !== t).map(o => idx(o.x, o.y)).concat(idx(st.adv.x, st.adv.y));
  if (!hasLOS(lv, a, b, others)) return { ok: false, why: 'los', rd };
  if (st.laurel.atkLeft < mStat(st, t, 'def')) return { ok: false, why: 'points', rd };
  return { ok: true, rd };
}
function laurelAttack(st, t) {
  st.laurel.atkLeft -= mStat(st, t, 'def');
  t.hp -= 1;
  const dead = t.hp <= 0;
  st.mons = st.mons.filter(o => o.hp > 0);
  return dead;
}
function laurelEnd(st) { st.laurel = null; }

function pushUndo(st) {
  st.undo.push(JSON.stringify({ x: st.adv.x, y: st.adv.y, hp: st.adv.hp, mons: st.mons,
                                spdLeft: st.turn.spdLeft, atkLeft: st.turn.atkLeft, sherpaOn: !!st.sherpaOn, corsairOn: !!st.corsairOn,
                                abil: !!st.abil, powder: !!st.powder, chestOpen: st.chest ? st.chest.open : null, loot: st.loot,
                                stoneBroken: st.stone ? st.stone.broken : null, fist: !!st.fist }));
}
function popUndo(st) {
  const s = JSON.parse(st.undo.pop());
  st.adv.x = s.x; st.adv.y = s.y; st.adv.hp = s.hp; st.mons = s.mons;
  st.turn.spdLeft = s.spdLeft; st.turn.atkLeft = s.atkLeft;
  st.sherpaOn = s.sherpaOn; st.corsairOn = s.corsairOn; st.abil = s.abil; st.powder = s.powder;
  if (st.chest && s.chestOpen != null) st.chest.open = s.chestOpen;
  st.loot = s.loot;
  if (st.stone && s.stoneBroken != null) st.stone.broken = s.stoneBroken;
  st.fist = !!s.fist;
}

function moveAdv(st, i, dist) {
  pushUndo(st);
  const [x, y] = XY(i);
  if (!st.corsairOn) st.turn.spdLeft -= dist;   // el Abordaje del Corsario no gasta Movimiento
  st.adv.x = x; st.adv.y = y;
  st.sherpaOn = false; st.corsairOn = false;   // el traslado con la habilidad del Sherpa o del Corsario se consume
}

// Nigromante: una vez por nivel pierde 1 de Vida para hacer 1 de daño a un enemigo a su Alcance
function necroInfo(st, m) {
  if (st.hero !== 'necromancer' || st.abil || st.adv.hp <= 1) return { ok: false, why: 'unavailable' };
  const lv = lvOf(st), a = idx(st.adv.x, st.adv.y), t = idx(m.x, m.y);
  const rd = rangeDist(lv, a, t);
  if (rd > (st.turn.rng || st.adv.rng)) return { ok: false, why: 'range', rd };
  if (!hasLOS(lv, a, t, st.mons.filter(o => o !== m).map(o => idx(o.x, o.y)))) return { ok: false, why: 'los', rd };
  return { ok: true, rd };
}
function necroStrike(st, m) {
  pushUndo(st);
  st.adv.hp -= 1; m.hp -= 1; st.abil = true;
  if (m.hp <= 0) { st.mons = st.mons.filter(o => o !== m); return true; }
  return false;
}

// Cazador de demonios: una vez por nivel mueve a un monstruo hasta 3 puntos de Movimiento
function demonReach(st, m) {
  const lv = lvOf(st), advI = idx(st.adv.x, st.adv.y), me = idx(m.x, m.y);
  const others = st.mons.filter(o => o !== m).map(o => idx(o.x, o.y));
  const bl = new Array(N).fill(false); bl[advI] = true;
  const D = dijkstra(lv, me, bl, bl), ok = new Array(N).fill(false);
  for (let i = 0; i < N; i++) if (i !== me && !lv.walls[i] && i !== advI && !others.includes(i) && D.dist[i] <= 3) ok[i] = true;
  return { ok, dist: D.dist, prev: D.prev };
}
function demonMove(st, m, i) {
  if (st.hero !== 'demonhunter' || st.abil || !demonReach(st, m).ok[i]) return null;
  pushUndo(st);
  const R = demonReach(st, m), path = [];
  for (let c = i; c !== -1; c = R.prev[c]) path.push(c);
  path.reverse();
  const [x, y] = XY(i); m.x = x; m.y = y; st.abil = true;
  return path;
}

/* ---------- Objetos (módulo de cartas de objeto) ---------- */
function itemUsable(st, id) {
  if (!st.items || !st.items.includes(id)) return false;
  const t = st.turn, ph = st.phase, lv = LEVELS[st.levelIdx];
  switch (id) {
    case 'cloak': return !st.cloak && (ph === 'energy' || ph === 'move') && lv.blizz.some(Boolean);
    case 'axe': case 'wyrm': return ph === 'move';
    case 'flame': case 'eye': return ph === 'energy' && !!t.dice;
    case 'hourglass': return ph === 'move';
    case 'powder': return ph === 'move' && !st.powder;
    case 'sands': return !st.sands && (ph === 'energy' || ph === 'move') && lv.water.some(Boolean);
    case 'holy': return !st.sands && (ph === 'energy' || ph === 'move') && lv.damned.some(Boolean);
    case 'fist': return ph === 'move' && !!st.stone && !st.stone.broken && !st.fist;
    case 'laurel': return ph === 'move' && !st.laurel && st.mons.length > 0;
    case 'gorgon': return (ph === 'energy' || ph === 'move') && !st.gorgon;
    default: return false;   // las hierbas se ofrecen al recibir un ataque
  }
}
function useItem(st, id) {
  if (!itemUsable(st, id)) return false;
  const t = st.turn;
  st.items = st.items.filter(i => i !== id);
  if (id === 'cloak') st.cloak = true;
  else if (id === 'axe') { t.atk += 2; t.atkLeft += 2; t.rng = (t.rng || st.adv.rng) + 2; st.undo = []; }
  else if (id === 'wyrm') { t.spd += 4; t.spdLeft += 4; st.undo = []; }
  else if (id === 'powder') st.powder = true;
  else if (id === 'sands' || id === 'holy') st.sands = true;   // las Arenas y el Agua bendita anulan los bonos de la casilla durante el nivel
  else if (id === 'fist') st.fist = true;
  else if (id === 'laurel') st.undo = [];
  else if (id === 'gorgon') st.gorgon = true;
  else if (id === 'hourglass') { st.phase = 'energy'; st.turn = freshTurn(); st.undo = []; st.turnNo++; st.sherpaOn = false; st.corsairOn = false; st.gorgon = false; }
  return true;
}
// Llama del destino: vuelve a tirar los dados elegidos y se queda con la segunda tirada
function useFlame(st, picks) {
  if (!itemUsable(st, 'flame')) return false;
  const t = st.turn, list = picks.filter(i => i !== t.lock && i >= 0 && i < 3);
  if (!list.length) return false;
  st.items = st.items.filter(i => i !== 'flame');
  for (const i of list) t.dice[i] = rollDie();
  t.sel = -1;
  return true;
}
// Ojo de dragón: un dado de Energía se tira como D12 en lugar de D6
function useEye(st, i, rnd = Math.random) {
  const t = st.turn;
  if (!itemUsable(st, 'eye') || i === t.lock || i < 0 || i > 2) return false;
  st.items = st.items.filter(x => x !== 'eye');
  t.dice[i] = 1 + Math.floor(rnd() * 12);
  t.sel = -1;
  return true;
}
// Hierbas curativas: tras el ataque de los monstruos, el daño pendiente se reduce a la mitad (hacia arriba)
function resolveDamage(st, useHerbs) {
  let dmg = st.pendingDmg || 0;
  st.pendingDmg = 0;
  if (useHerbs && st.items.includes('herbs')) { dmg = Math.ceil(dmg / 2); st.items = st.items.filter(i => i !== 'herbs'); }
  st.adv.hp = Math.max(0, st.adv.hp - dmg);
  return dmg;
}

// devuelve true si el monstruo muere (con Pólvora negra el daño se extiende a todos los demás monstruos)
function attackMon(st, m) {
  pushUndo(st);
  st.turn.atkLeft -= mStat(st, m, 'def');
  m.hp -= 1;
  if (st.powder) { st.powder = false; for (const o of st.mons) if (o !== m) o.hp -= 1; }
  const dead = m.hp <= 0;
  st.mons = st.mons.filter(o => o.hp > 0);
  return dead;
}

/* ---------- Fase de los monstruos ---------- */
function walkToward(D, me, target, spd, others) {
  const path = [];
  for (let c = target; c !== -1; c = D.prev[c]) path.push(c);
  path.reverse();
  let last = 0;
  for (let k = 1; k < path.length; k++) { if (D.dist[path[k]] <= spd) last = k; else break; }
  while (last > 0 && others.includes(path[last])) last--;
  return path[last];
}

function chooseMove(lv, st, m) {
  const advI = idx(st.adv.x, st.adv.y), me = idx(m.x, m.y);
  const others = st.mons.filter(o => o !== m).map(o => idx(o.x, o.y));
  const blocked = new Array(N).fill(false);
  blocked[advI] = true;
  const D = dijkstra(lv, me, blocked, blocked);
  const free = i => !lv.walls[i] && i !== advI && !others.includes(i) && D.dist[i] < Infinity;
  const R = i => m.rng + (monBonus(st, m, i).rng || 0);   // el Alcance depende de la casilla (agua)
  let target = -1, bestCost = Infinity;
  // 1) casilla a Alcance máximo, con visión, la más cercana al monstruo
  for (let i = 0; i < N; i++) {
    if (free(i) && rangeDist(lv, i, advI) === R(i) && D.dist[i] < bestCost && hasLOS(lv, i, advI, others)) {
      bestCost = D.dist[i]; target = i;
    }
  }
  // 2) si no hay, la de mayor Alcance posible con visión
  if (target < 0) {
    let bestRd = -1; bestCost = Infinity;
    for (let i = 0; i < N; i++) {
      if (!free(i)) continue;
      const rd = rangeDist(lv, i, advI);
      if (rd > R(i) || !hasLOS(lv, i, advI, others)) continue;
      if (rd > bestRd || (rd === bestRd && D.dist[i] < bestCost)) { bestRd = rd; bestCost = D.dist[i]; target = i; }
    }
  }
  if (target >= 0) {
    if (D.dist[target] <= m.spd) return target;          // llega este turno
    // No llega: gasta toda su velocidad acercándose al máximo al destino. Se elige entre todas las
    // casillas alcanzables, no solo a lo largo de un camino, para no desperdiciar puntos de velocidad.
    // Si desde alguna casilla alcanzable ya puede atacar, nunca se queda fuera de alcance: elige la de mayor Alcance
    let atk = -1, atkRd = -1, atkC = Infinity;
    for (let i = 0; i < N; i++) {
      if (!free(i) && i !== me) continue;
      if (D.dist[i] > m.spd) continue;
      const rd = rangeDist(lv, i, advI);
      if (rd > R(i) || !hasLOS(lv, i, advI, others)) continue;
      if (rd > atkRd || (rd === atkRd && D.dist[i] < atkC)) { atk = i; atkRd = rd; atkC = D.dist[i]; }
    }
    if (atk >= 0) return atk;
    const T = dijkstra(lv, target, blocked, blocked).dist;
    let best = me, bestT = T[me], bestR = rangeDist(lv, me, advI), bestC = 0;
    for (let i = 0; i < N; i++) {
      if (!free(i) || D.dist[i] > m.spd) continue;
      const r = rangeDist(lv, i, advI);
      if (T[i] < bestT || (T[i] === bestT && (r < bestR || (r === bestR && D.dist[i] < bestC)))) {
        best = i; bestT = T[i]; bestR = r; bestC = D.dist[i];
      }
    }
    return best;
  }
  // 3) acercarse todo lo posible
  let best = me, bestD = rangeDist(lv, me, advI), bestC = 0;
  for (let i = 0; i < N; i++) {
    if (!free(i) || D.dist[i] > m.spd) continue;
    const d = rangeDist(lv, i, advI);
    if (d < bestD || (d === bestD && D.dist[i] < bestC)) { best = i; bestD = d; bestC = D.dist[i]; }
  }

  function save() {
    try {
      if (!G || G.laurel) return;
      if (G.phase === 'won') { localStorage.removeItem(SAVE_KEY); return; }
      let sv = G;
      if (G.phase === 'dead') { sv = E.retryLevel(G); sv.totalTurns = G.totalTurns; }
      localStorage.setItem(SAVE_KEY, JSON.stringify(sv));
    } catch (e) {}

  function loadSaved() {
    try {

    } catch (e) { return null; }
  }
  const okItems = (a, game) => Array.isArray(a) && a.length <= 3 && new Set(a).size === a.length && a.every(i => itemPool(game).includes(i)) && (GAMES[game].items || !a.length);
  const bool = (o, k) => { if (o[k] == null) o[k] = false; return typeof o[k] === 'boolean'; };
  function validState(g) {
    if (!g || !g.adv || !g.turn || !Array.isArray(g.mons)) return false;
    if (g.game == null) g.game = 'base';             // partidas guardadas antes de las expansiones
    if (!GAMES[g.game]) return false;
    useGame(g.game);
    const lv = LEVELS[g.levelIdx];
    if (!lv) return false;
    if (g.items == null) g.items = [];

    if (g.cp && !['cloak', 'sands', 'abil'].every(k => bool(g.cp, k))) return false;

    if (!okItems(g.items, g.game) || !g.cp || !okItems(g.cp.items, g.game)) return false;

  const DESK = window.matchMedia('(min-width: 1000px) and (min-aspect-ratio: 3/2)');
  function fit() {
    if (document.body.classList.contains('menu')) return;
    if (DESK.matches) { document.body.classList.remove('tight'); return; }
    const root = document.documentElement, box = $('#boxBoard');
    const w = box.clientWidth || 340;
    let t = Math.max(40, Math.min(68, Math.floor((w - 4) / COLS)));
    const vh = window.innerHeight || 700;
    document.body.classList.toggle('tight', vh < 780);
    root.style.setProperty('--t', t + 'px');
    const app = $('.app'), board = $('#board'), panel = $('.panel'), dr = $('#diceRow');
    // alto de todo lo que no es el tablero; el panel se cuenta con la fila de dados, que solo se ve en la fase de Energía
    const panelH = panel.offsetHeight + (dr.offsetHeight ? 0 : 54);
    const cs = getComputedStyle(app), gap = parseFloat(cs.rowGap) || 0;
    const others = $('.top').offsetHeight + ($('#card').offsetHeight - board.offsetHeight) + panelH + gap * 2
      + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const byH = Math.floor((vh - others - 14) / ROWS);
    if (byH < t) t = Math.max(38, byH);
    root.style.setProperty('--t', t + 'px');
  }

  function buildBoard() {

      b.type = 'button';
      b.className = 'tile' + (lv.walls[i] ? ' wall' : '') + (lv.voids[i] ? ' void' : '') + (lv.blizz[i] ? ' blizz' : '') + (lv.water[i] ? ' water' : '') + (lv.damned && lv.damned[i] ? ' damned' : '') + (lv.stoneAt === i ? ' stone' : '');
      b.dataset.i = i;
      b.setAttribute('aria-label', lv.voids[i] ? 'Hueco' : lv.walls[i] ? 'Muro' : lv.blizz[i] ? `Ventisca, columna ${x + 1}, fila ${y + 1}` : lv.water[i] ? `Agua, columna ${x + 1}, fila ${y + 1}` : lv.stoneAt === i ? 'Piedra de la Perdición' : lv.damned && lv.damned[i] ? `Casilla maldita, columna ${x + 1}, fila ${y + 1}` : `Casilla columna ${x + 1}, fila ${y + 1}`);

  const setPos = (el, x, y) => { el.style.setProperty('--x', x); el.style.setProperty('--y', y); };

  function syncTokens() {
    const layer = $('#tokens');
    if (!tok.adv) {
      const a = document.createElement('div');
      a.className = 'token pj';
      a.innerHTML = (HERO_ICONS[G.hero] || ICON_ADV) + '<span class="badge"></span>';
      layer.appendChild(a); tok.adv = a;
    }
    if (!tok.adv.dataset.anim) setPos(tok.adv, G.adv.x, G.adv.y);
    tok.adv.querySelector('.badge').textContent = G.adv.hp;
    const alive = new Set(G.mons.map(m => m.id));
    for (const [id, el] of tok.mons) {
      if (!alive.has(id)) { el.classList.add('dying'); setTimeout(() => el.remove(), 400); tok.mons.delete(id); }
    }
    const key = LEVELS[G.levelIdx].mon.key;
    for (const m of G.mons) {
      let el = tok.mons.get(m.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'token mon k-' + key;
        el.innerHTML = ICONS[key] + '<span class="badge"></span>';
        setPos(el, m.x, m.y);
        layer.appendChild(el); tok.mons.set(m.id, el);
      }
      if (!el.dataset.anim) setPos(el, m.x, m.y);
      el.querySelector('.badge').textContent = m.hp;
      const boosted = E.mStat(G, m, 'atk') !== m.atk || E.mStat(G, m, 'def') !== m.def || E.mStat(G, m, 'rng') !== m.rng;
      const hellMon = LEVELS[G.levelIdx].mon.bonusOn === 'hero';

  function renderTiles() {
    const tiles = $('#grid').children;
    let reach = null, demon = null;
    const targets = new Set();
    let lau = null;
    if (G.phase === 'move' && !busy) {
      if (G.laurel) {
        const R = E.laurelReach(G), me = E.laurelMon(G);
        lau = { R, me };
        for (const m of G.mons) if (m !== me && E.laurelAttackInfo(G, m).ok) targets.add(idx(m.x, m.y));
      }
      else if (mode === 'laurelPick') { for (const m of G.mons) targets.add(idx(m.x, m.y)); }
      else if (mode && mode.demon) demon = E.demonReach(G, mode.demon);
      else if (mode === 'necro') { for (const m of G.mons) if (E.necroInfo(G, m).ok) targets.add(idx(m.x, m.y)); }
      else if (mode === 'demonPick') { for (const m of G.mons) targets.add(idx(m.x, m.y)); }
      else {
        reach = E.reachFromAdv(G);
        for (const m of G.mons) if (E.attackInfo(G, m).ok) targets.add(idx(m.x, m.y));
        if (G.chest && E.chestInfo(G).ok) targets.add(G.chest.at);
        if (G.stone && E.stoneInfo(G).ok) targets.add(G.stone.at);
      }
    }
    for (let i = 0; i < N; i++) {
      const t = tiles[i];
      const isLau = lau && lau.R.dist[i] > 0 && lau.R.dist[i] <= G.laurel.spdLeft;
      const isReach = (reach && reach.dist[i] > 0 && (reach.free ? reach.dist[i] < Infinity : reach.dist[i] <= G.turn.spdLeft)) || (demon && demon.ok[i]) || isLau;
      t.classList.toggle('reach', !!isReach);
      if (reach && isReach) t.dataset.cost = reach.free ? '·' : reach.dist[i]; else if (demon && isReach) t.dataset.cost = demon.dist[i]; else if (isLau) t.dataset.cost = lau.R.dist[i]; else delete t.dataset.cost;
      t.classList.toggle('target', targets.has(i));
    }
    // Segundo dibujo del héroe, fijo dentro de su casilla (sin transformaciones): así se ve aunque el navegador falle con la ficha flotante
    const hi = idx(G.adv.x, G.adv.y), showSpot = !(tok.adv && tok.adv.dataset.anim);
    for (let i = 0; i < N; i++) { const sp = tiles[i].querySelector('.herospot'); if (sp && !(showSpot && i === hi)) sp.remove(); }
    if (showSpot && !tiles[hi].querySelector('.herospot')) tiles[hi].insertAdjacentHTML('beforeend', `<span class="herospot" aria-hidden="true">${HERO_ICONS[G.hero] || ICON_ADV}</span>`);
    // el dibujo de la casilla mira hacia el mismo lado que la ficha (si no, los dos dibujos se ven superpuestos y espejados)
    if (showSpot && tok.adv) tiles[hi].querySelector('.herospot').style.setProperty('--flip', tok.adv.style.getPropertyValue('--flip') || 1);
    if (G.chest) {
      const c = $('#grid').children[G.chest.at].querySelector('.chest');
      if (c) { c.classList.toggle('open', G.chest.open); c.querySelector('em').textContent = G.chest.open ? '' : G.chest.val; }
    }
    if (G.stone) {
      const c = $('#grid').children[G.stone.at].querySelector('.gem');
      if (c) { c.classList.toggle('broken', G.stone.broken); c.querySelector('em').textContent = G.stone.broken ? '' : G.stone.val; }
    }
    for (const [id, el] of tok.mons) el.classList.toggle('ordered', !!(lau && lau.me && lau.me.id === id));
  }

  // Desliza una ficha por un camino. Cada casilla en recto dura 4 s / velocidad total y cada casilla
  // en diagonal 6 s / velocidad total (la diagonal cuesta 3 de Mov y la recta 2: misma proporción).
  const STEP_S = { straight: 4, diagonal: 6 };
  async function glide(el, path, speed) {
    el.dataset.anim = '1';
    el.classList.add('walking');
    el.style.transitionTimingFunction = 'linear';
    for (let k = 1; k < path.length; k++) {
      const [px, py] = XY(path[k - 1]), [x, y] = XY(path[k]);
      const dur = 1000 * (px !== x && py !== y ? STEP_S.diagonal : STEP_S.straight) / Math.max(1, speed);
      el.style.transitionDuration = dur + 'ms';
      if (x !== px) el.style.setProperty('--flip', x < px ? -1 : 1);
      setPos(el, x, y);
      await sleep(dur);
    }
    el.classList.remove('walking');
    el.style.transitionDuration = ''; el.style.transitionTimingFunction = '';
    delete el.dataset.anim;
  }

  function floatText(x, y, text, cls) {
    const f = document.createElement('div');
    f.className = 'float ' + cls; f.textContent = text;
    setPos(f, x, y);
    $('#tokens').appendChild(f);
    setTimeout(() => f.remove(), 950);
  }

  /* ---------- panel ---------- */
  function dieHTML(v, extra) {
    if (v > 6) return `<span class="die num ${extra || ''}" aria-label="Dado ${v}"><b>${v}</b><small>D12</small></span>`;
    const on = PIPS[v] || [];
    let s = '';
    for (let i = 0; i < 9; i++) s += `<i class="${on.includes(i) ? 'on' : ''}"></i>`;
    return `<span class="die ${extra || ''}" aria-label="Dado ${v}">${s}</span>`;
  }

  const regularCount = () => LEVELS.filter(l => !l.boss).length;
  const bossCount = () => LEVELS.filter(l => l.boss).length;
  const stageLabel = lv => lv.boss ? `Jefe ${lv.boss}` : `Nivel ${lv.num}`;
  function renderHead() {
    const lv = LEVELS[G.levelIdx];
    $('.lvl-num').innerHTML = lv.boss ? `Jefe <b id="lvlNum">${lv.boss}</b> de <span id="lvlTot">${bossCount()}</span>` : `Nivel <b id="lvlNum">${lv.num}</b> de <span id="lvlTot">${regularCount()}</span>`;
    $('#lvlName').textContent = lv.title;
    $('#dots').innerHTML = LEVELS.map((l, i) => `<i class="${l.boss ? 'boss ' : ''}${i < G.levelIdx ? 'done' : i === G.levelIdx ? 'now' : ''}"></i>`).join('');
    const m = lv.mon, bo = m.bonus;
    const st = (k, v) => `<div><b>${v}</b>${bo && bo[k] ? `<u>+${bo[k]}</u>` : ''}<span>${{ hp: 'Vida', spd: 'Vel', atk: 'Atq', def: 'Def', rng: 'Alc' }[k]}</span></div>`;
    $('#foot').innerHTML = `
      <div class="ico">${ICONS[m.key]}</div>
      <div>
        <div class="nm">${m.plural}<small>${lv.boss ? 'jefe' : `quedan ${G.mons.length} de ${lv.spawns.length}`}</small></div>
        <div class="stats">${['hp', 'spd', 'atk', 'def', 'rng'].map(k => st(k, m[k])).join('')}</div>
        ${bo ? (m.bonusOn === 'hero' ? `<div class="wnote hell ${G.sands ? 'off' : lv.damned[idx(G.adv.x, G.adv.y)] ? 'on' : ''}">${G.sands ? 'Agua bendita: los bonos no cuentan este nivel.' : lv.damned[idx(G.adv.x, G.adv.y)] ? 'Estás en casilla maldita: suman el bono.' : 'Si estás en casilla maldita, suman el bono en rojo.'}</div>` : '<div class="wnote">En casillas de agua suman el bono en azul.</div>') : ''}
      </div>`;
  }

  function renderHP() {
    const hp = G.adv.hp;
    $('#pips').innerHTML = Array.from({ length: START_HP }, (_, i) =>
      `<i class="${i < hp ? 'on' : ''}${i >= hp && i < lastHp ? ' lost' : ''}"></i>`).join('');
    $('#hpnum').textContent = `Vida ${hp} / ${START_HP}`;
    const hb = $('#heroBox');
    if (hb) {
      if (hb.dataset.hero !== G.hero) { hb.dataset.hero = G.hero; hb.innerHTML = `<span class="ico">${HERO_ICONS[G.hero] || ICON_ADV}</span><b>${HEROES[G.hero].name}</b><p>${HEROES[G.hero].txt}</p><div class="hpbar"><div class="pips"></div><span class="hpnum"></span></div>`; }
      hb.querySelector('.pips').innerHTML = $('#pips').innerHTML;
      hb.querySelector('.hpnum').textContent = `Vida ${hp} / ${START_HP}`;
    }
    $('#heroTag').textContent = HEROES[G.hero].name;
    if (tok.adv) tok.adv.querySelector('.badge').textContent = hp;
    lastHp = hp;
  }

  const slotKeys = t => (t.ranger ? ['atk', 'def', 'rng'] : ['spd', 'atk', 'def']);
  const usedDice = t => { const u = new Set(); for (const k of ['spd', 'atk', 'def', 'rng']) { u.add(t.assign[k]); if (t.assign2) u.add(t.assign2[k]); } return u; };

  const pen0 = k => (G.phase === 'move' || G.phase === 'monsters') && (k === 'atk' || k === 'def') && E.blizzPen(G) > 0;
  function renderChips() {
    const t = G.turn, a = G.adv, ph = G.phase;
    const sk = slotKeys(t);
    const out = [];
    for (const k of ['spd', 'atk', 'def', 'rng']) {
      let val = a[k], sub = 'base', cls = 'chip', bar = '';
      const slot = ph === 'energy' && sk.includes(k);
      const lootHere = t.loot && t.loot.k === k ? t.loot.n : 0;
      if (ph === 'energy') {
        if (slot) cls += ' slot';
        if (t.dice) {
          const ds = [t.assign[k], t.assign2 ? t.assign2[k] : -1].filter(i => i >= 0);
          const parts = ds.map(i => dieHTML(t.dice[i], 'mini'));
          if (lootHere) parts.push(`<span class="lootn">+${lootHere}</span>`);
          if (ds.length || lootHere) {
            val = a[k] + ds.reduce((x, i) => x + t.dice[i], 0) + lootHere;
            sub = `${a[k]} + ${parts.join(' + ')}`;
            cls += ' filled' + (t.lock === k ? ' locked' : '');
          } else if (slot) { sub = 'asigna un dado'; if (t.sel >= 0) cls += ' armed'; }
          else sub = 'sin dado';
          if (slot && t.sel >= 0 && ds.length === 1 && t.knight) cls += ' armed';
        } else if (!slot) sub = 'sin dado';
      } else if (ph === 'move' || ph === 'monsters') {
        const pen = E.blizzPen(G);
        if (k === 'spd') { val = t.spdLeft; sub = `de ${t.spd}`; bar = `<span class="bar"><i style="width:${t.spd ? (100 * t.spdLeft / t.spd) : 0}%"></i></span>`; }
        else if (k === 'atk') { val = E.atkAvail(G); sub = pen ? 'ventisca −1' : `de ${t.atk}`; bar = `<span class="bar"><i style="width:${t.atk ? (100 * t.atkLeft / t.atk) : 0}%"></i></span>`; }
        else if (k === 'def') { val = E.heroDef(G); sub = pen ? 'ventisca −1' : 'este turno'; }
        else { val = t.rng || a.rng; sub = t.rng !== a.rng ? 'este turno' : 'fijo'; }
      }
      if (pen0(k)) cls += ' chilled';
      const clickable = slot && t.dice && !rolling && t.lock !== k;
      out.push(`<button type="button" class="${cls}" data-k="${k}" ${clickable ? '' : 'tabindex="-1"'} aria-label="${LONG[k]} ${val}">
        <span class="lbl">${NAMES[k]}</span><span class="val">${val}</span><span class="sub">${sub}</span>${bar}</button>`);
    }
    $('#chips').innerHTML = out.join('');
  }

  function renderDice() {
    const t = G.turn, row = $('#diceRow');
    row.classList.toggle('moving', G.phase !== 'energy');
    if (G.phase !== 'energy') {
      if (G.phase === 'move' && t.dice) row.innerHTML = t.dice.map(v => dieHTML(v, 'used')).join('');
      else row.innerHTML = '';
      return;
    }
    if (!t.dice) { row.innerHTML = '<span class="hint">Tres dados de Energía por turno</span>'; return; }
    if (rolling) {
      row.innerHTML = [0, 1, 2].map(i => (t.lock >= 0 && i === 0) ? dieHTML(t.dice[0], 'locked') : keepSet.has(i) ? dieHTML(t.dice[i], 'used') : dieHTML(1 + Math.floor(Math.random() * 6), 'rolling')).join('');
      return;
    }
    const used = usedDice(t);
    row.innerHTML = t.dice.map((v, i) => {
      const d = dieHTML(v, (t.sel === i ? 'sel ' : '') + (used.has(i) ? 'used' : ''));
      return d.replace('<span class="die', `<button type="button" data-d="${i}" class="die`).replace('</span>', '</button>');
    }).join('');
  }

  function renderBanner() {
    const t = G.turn, ph = G.phase;
    let step = '1', txt = '';
    if (ph === 'energy') {
      if (!t.dice) txt = 'Tira los tres dados de <em>Energía</em>.';
      else if (!E.assignComplete(t)) txt = t.knight ? 'Caballero: reparte los tres dados; puedes poner dos en la misma habilidad.' : t.ranger ? 'Toca un dado y luego <em>Alc</em>, <em>Atq</em> o <em>Def</em>.' : 'Toca un dado y luego <em>Mov</em>, <em>Atq</em> o <em>Def</em>.';
      else txt = 'Reparto listo. Confírmalo o toca una habilidad para cambiarlo.';
    } else if (ph === 'move') {
      step = '2';
      txt = mode === 'necro' ? 'Nigromante: toca el monstruo al que quieres hacer <em>1 de daño</em> (cuesta 1 de tu Vida).'
        : mode === 'demonPick' ? 'Cazador: toca el monstruo que quieres <em>mover</em>.'
        : mode && mode.demon ? 'Cazador: toca la casilla marcada a la que lo mueves (hasta 3 de Mov).'
        : mode === 'laurelPick' ? 'Corona de laurel: toca el monstruo al que das la orden.'
        : G.laurel ? 'Corona de laurel: mueve al monstruo o toca a otro monstruo para que lo ataque. Termina la orden cuando quieras.'
        : 'Toca una casilla marcada para <em>moverte</em>, o un monstruo, el cofre o la piedra resaltados para <em>atacar</em>.';
    }
    else if (ph === 'monsters') { step = '3'; txt = 'Turno de los monstruos.'; }
    else if (ph === 'clear') { step = '2'; txt = 'Nivel superado.'; }
    $('#step').textContent = step;
    $('#bannerText').innerHTML = txt;
  }

  function nothingLeft() {
    if (G.phase !== 'move') return false;
    const R = E.reachFromAdv(G);
    for (let i = 0; i < N; i++) if (R.dist[i] > 0 && R.dist[i] <= G.turn.spdLeft) return false;
    if (G.chest && E.chestInfo(G).ok) return false;
    if (G.stone && E.stoneInfo(G).ok) return false;
    return !G.mons.some(m => E.attackInfo(G, m).ok);
  }

  function renderActions() {
    const t = G.turn, ph = G.phase, box = $('#actions');
    if (ph === 'energy') {
      const ab = E.abilityInfo(G);
      const abBtn = ab ? `<button type="button" class="btn abil" id="btnAbil" ${rolling ? 'disabled' : ''}>${ab.label}</button>` : '';
      if (!t.dice) box.innerHTML = abBtn + `<button type="button" class="btn primary" id="btnRoll" ${rolling ? 'disabled' : ''}>Tirar dados</button>`;
      else box.innerHTML = abBtn + `<button type="button" class="btn primary" id="btnConfirm" ${E.assignComplete(t) && !rolling ? '' : 'disabled'}>Confirmar</button>`;
    } else if (ph === 'move') {
      if (G.laurel) { box.innerHTML = `<button type="button" class="btn primary" id="btnLaurelEnd" ${busy ? 'disabled' : ''}>Terminar orden</button>`; return; }
      if (mode === 'laurelPick') { box.innerHTML = `<button type="button" class="btn" id="btnLaurelNo">Cancelar</button>`; return; }
      const ab = E.abilityInfo(G);
      const cancel = (ab && ((ab.id === 'necro' && mode === 'necro') || (ab.id === 'demon' && mode))) ? 'Cancelar' : null;
      const abBtn = ab ? `<button type="button" class="btn abil tight ${G.sherpaOn || G.corsairOn || cancel ? 'on' : ''}" id="btnAbil" ${busy ? 'disabled' : ''}>${cancel || ab.label}</button>` : '';
      box.innerHTML = `<button type="button" class="btn small" id="btnUndo" ${G.undo.length && !busy ? '' : 'disabled'}>Deshacer</button>${abBtn}
        <button type="button" class="btn primary ${nothingLeft() ? 'pulse' : ''}" id="btnEnd" ${busy ? 'disabled' : ''}>Fin de turno</button>`;
    } else {
      box.innerHTML = `<button type="button" class="btn" disabled>${ph === 'monsters' ? 'Los monstruos actúan…' : '…'}</button>`;
    }
  }

  function renderItems() {
    const box = $('#items');
    const list = G.items || [];
    const act = [];
    if (G.cloak) act.push(['cloak', 'Capa activa']);
    if (G.sands) act.push(LEVELS[G.levelIdx].damned && LEVELS[G.levelIdx].damned.some(Boolean) ? ['holy', 'Agua bendita activa'] : ['sands', 'Arenas activas']);
    if (G.fist) act.push(['fist', 'Puño listo']);
    if (G.powder) act.push(['powder', 'Pólvora lista']);
    if (G.gorgon) act.push(['gorgon', 'Gorgona activa']);
    if (!list.length && !act.length) { box.innerHTML = ''; box.hidden = true; return; }
    box.hidden = false;
    const idle = id => !E.itemUsable(G, id) || busy || rolling || G.phase === 'monsters';
    box.innerHTML = list.map(id => `<button type="button" class="item ${idle(id) ? 'idle' : ''}" data-item="${id}" aria-label="${ITEMS[id].name}">
        <span class="ico">${ITEM_ICONS[id]}</span><span>${ITEMS[id].short}</span></button>`).join('')
      + act.map(([id, txt]) => `<span class="item on" aria-label="${txt}"><span class="ico">${ITEM_ICONS[id]}</span><span>${txt}</span></span>`).join('');
  }

  function renderLoot() {
    const box = $('#loot'), t = G.turn;
    if (!(G.loot > 0)) { box.innerHTML = ''; box.hidden = true; return; }
    box.hidden = false;
    const can = G.phase === 'energy' && t.dice && !rolling;
    const set = t.loot && t.loot.k && G.phase === 'energy' ? `+${t.loot.n} a ${NAMES[t.loot.k]}` : '';
    box.innerHTML = `<span class="ico">${ICON_CHEST}</span><span class="txt">Botín del cofre: <b>${G.loot}</b> punto${G.loot > 1 ? 's' : ''}${set ? ' · ' + set : ''}</span>
      ${can ? `<button type="button" class="btn mini" id="btnLoot">${set ? 'Cambiar' : 'Sumar'}</button>` : ''}`;
  }

  function say(html) { $('#log').innerHTML = html; }

  function render() {
    if (G.phase !== 'move') mode = null;
    if (builtLevel !== G.levelIdx) buildBoard();
    renderHead();
    syncTokens();
    renderHP();
    renderChips();
    renderDice();
    renderBanner();
    renderItems();
    renderLoot();
    renderActions();
    renderTiles();
    if (needFit) { needFit = false; fit(); requestAnimationFrame(fit); }
    if (!busy) save();
  }

  /* ---------- hojas ---------- */
  function openSheet(html, buttons, dismiss) {
    closeSheet();
    const veil = document.createElement('div');
    veil.className = 'veil'; veil.id = 'veil';
    veil.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(veil);
    if (dismiss) veil.addEventListener('click', e => { if (e.target === veil) closeSheet(); });
    for (const [sel, fn] of buttons || []) {
      const el = veil.querySelector(sel);
      if (el) el.addEventListener('click', fn);
    }
    const first = veil.querySelector('button'); if (first) first.focus({ preventScroll: true });
    return veil;
  }
  function closeSheet() { const v = $('#veil'); if (v) v.remove(); }

    peak: 'Sube los 10 niveles de la Montaña Eterna. En el último te espera el Hechicero Blanco.',

      <label class="opt"><input type="checkbox" id="oSfx" ${Sfx.on ? 'checked' : ''}><span>Efectos de sonido</span></label>

      <button type="button" class="btn" id="oOk">Listo</button>`, [['#oOk', closeSheet]], true);

  }

  function rulesSheet() {
