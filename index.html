<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060d1a">
<title>Dungeon in One Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
/* Plano cianotipo: una carta de una sola tinta azul, la antorcha como único acento.
   Layout: carta centrada con tablero y ficha de monstruos; mandos debajo. */
:root {
  --bg: #060d1a;
  --card: #0d1f3c;
  --tile: #122a4d;
  --line: #7fa8dc;
  --line-dim: rgba(127, 168, 220, .26);
  --chalk: #e6f0fb;
  --muted: #8ea8cb;
  --torch: #ff8b3d;
  --foe: #ff5a78;
  --display: 'Pirata One', 'Times New Roman', serif;
  --body: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --t: 60px;
  --cols: 5;
  --rows: 5;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--chalk); }
body {
  font-family: var(--body); font-size: 18px; line-height: 1.25;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(127,168,220,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(127,168,220,.07) 1px, transparent 1px);
  background-size: 26px 26px;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--torch); outline-offset: 2px; }

.app {
  width: 100%; max-width: 440px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) 14px calc(env(safe-area-inset-bottom) + 22px);
  display: flex; flex-direction: column; gap: 12px;
}

/* ---- cabecera ---- */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.brand { display: flex; flex-direction: column; line-height: .9; }
.brand .mark { font-family: var(--display); font-size: 34px; letter-spacing: .01em; }
.brand .sub { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--torch); font-weight: 600; margin-top: 2px; }
.top-actions { display: flex; gap: 8px; }
.ghost {
  background: transparent; border: 1.5px solid var(--line-dim); border-radius: 6px;
  padding: 7px 12px; min-height: 38px; font-size: 15px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.ghost:hover { border-color: var(--line); color: var(--chalk); }

/* ---- carta ---- */
.card-wrap { perspective: 1400px; }
.card {
  position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: inset 0 0 0 4px var(--card), inset 0 0 0 5px var(--line-dim), 0 18px 40px rgba(0,0,0,.45);
  transform-origin: 50% 50%;
}
.card.flip-out { animation: flipOut .32s ease-in forwards; }
.card.flip-in { animation: flipIn .36s ease-out forwards; }
@keyframes flipOut { to { transform: rotateY(90deg); } }
@keyframes flipIn { from { transform: rotateY(-90deg); } to { transform: rotateY(0); } }

.card-head { display: flex; flex-direction: column; gap: 4px; padding: 2px 6px 0; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lvl-name { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; }
.lvl-num { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lvl-num b { color: var(--torch); font-size: 16px; letter-spacing: .1em; }
.dots { display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border: 1px solid var(--line); transform: rotate(45deg); }
.dots i.done { background: var(--line); }
.dots i.now { background: var(--torch); border-color: var(--torch); }

/* ---- tablero ---- */
.board-box { display: flex; justify-content: center; }
.board { position: relative; width: calc(var(--t) * var(--cols)); height: calc(var(--t) * var(--rows)); border: 1.5px solid var(--line); background: rgba(127,168,220,.04); }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), var(--t)); grid-template-rows: repeat(var(--rows), var(--t)); }
.tile {
  position: relative; width: var(--t); height: var(--t); padding: 0; border: 0; border-radius: 0;
  background: transparent; box-shadow: inset 0 0 0 .5px var(--line-dim); color: var(--chalk);
}
.tile.wall {
  background-color: #1a3a68;
  background-image: repeating-linear-gradient(135deg, rgba(127,168,220,.55) 0 1.5px, transparent 1.5px 7px);
  box-shadow: inset 0 0 0 1.5px var(--line); cursor: default;
}
.tile .stair { position: absolute; inset: 22%; opacity: .55; color: var(--line); }
.tile .stair svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tile.reach { background: rgba(255,139,61,.10); box-shadow: inset 0 0 0 1px rgba(255,139,61,.7); }
.tile.reach::before { content: ''; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; background: var(--torch); transform: rotate(45deg); opacity: .8; }
.tile.reach::after {
  content: attr(data-cost); position: absolute; right: 3px; bottom: 1px; font-size: 12px; font-weight: 700; color: var(--torch);
}
.tile.target { box-shadow: inset 0 0 0 2px var(--foe); background: rgba(255,90,120,.14); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 2px rgba(255,90,120,.35); } }

.tokens { position: absolute; inset: 0; pointer-events: none; }
.token {
  position: absolute; left: 0; top: 0; width: var(--t); height: var(--t);
  transform: translate(calc(var(--x) * var(--t)), calc(var(--y) * var(--t)));
  transition: transform .4s cubic-bezier(.3,.75,.25,1);
  display: grid; place-items: center;
}
.token svg { width: 72%; height: 72%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.token.mon { color: var(--foe); }
.token.adv { color: var(--torch); z-index: 3; }
.token.adv svg { filter: drop-shadow(0 0 6px rgba(255,139,61,.55)); }
.token .badge {
  position: absolute; right: 2px; bottom: 2px; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 9px;
  background: var(--card); border: 1.5px solid currentColor; font-size: 13px; font-weight: 700; line-height: 14px; text-align: center; color: var(--chalk);
}
.token.dying { opacity: 0; transform: translate(calc(var(--x) * var(--t)), calc(var(--y) * var(--t))) scale(.4); transition: opacity .35s, transform .35s; }
.token.hit svg { animation: hitflash .5s; }
.token.hurt { animation: shake .45s; }
@keyframes hitflash { 30% { filter: drop-shadow(0 0 8px var(--foe)); stroke-width: 3; } }
@keyframes shake { 20% { translate: -4px 0; } 40% { translate: 4px 0; } 60% { translate: -3px 0; } 80% { translate: 3px 0; } }
.float {
  position: absolute; z-index: 5; width: var(--t); text-align: center; font-weight: 700; font-size: 22px;
  left: calc(var(--x) * var(--t)); top: calc(var(--y) * var(--t)); animation: floatup .9s ease-out forwards; pointer-events: none;
  text-shadow: 0 1px 0 var(--card), 0 0 6px var(--card);
}
.float.dmg { color: var(--foe); } .float.good { color: var(--chalk); }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }

/* ---- ficha de monstruos (pie de la carta) ---- */
.foot { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 10px; border-top: 1.5px solid var(--line-dim); padding: 10px 4px 2px; }
.foot .ico { width: 54px; height: 54px; color: var(--foe); border: 1.5px solid var(--line-dim); border-radius: 8px; display: grid; place-items: center; position: relative; }
.foot .ico svg { width: 70%; height: 70%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.foot .nm { font-family: var(--display); font-size: 22px; line-height: 1; }
.foot .nm small { font-family: var(--body); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-left: 6px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
.stats div { text-align: center; border: 1px solid var(--line-dim); border-radius: 5px; padding: 2px 0 1px; }
.stats b { display: block; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.stats span { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---- panel de mando ---- */
.panel { display: flex; flex-direction: column; gap: 10px; }
.banner { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.step { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 1.5px solid var(--torch); color: var(--torch); border-radius: 50%; font-weight: 700; font-size: 16px; }
.banner p { margin: 0; font-size: 17px; color: var(--chalk); }
.banner p em { font-style: normal; color: var(--torch); font-weight: 700; }

.hp-row { display: flex; align-items: center; gap: 10px; }
.hp-row .lab { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); font-weight: 600; width: 44px; }
.pips { display: flex; gap: 7px; }
.pips i { width: 14px; height: 14px; transform: rotate(45deg); border: 1.5px solid var(--torch); transition: background .25s; }
.pips i.on { background: var(--torch); }
.pips i.lost { animation: pip .5s; }
@keyframes pip { 40% { background: var(--foe); border-color: var(--foe); } }
.hpnum { margin-left: auto; font-size: 15px; color: var(--muted); font-weight: 600; }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-height: 74px; padding: 6px 4px; background: rgba(127,168,220,.06); border: 1.5px solid var(--line-dim); border-radius: 9px; text-align: center;
}
.chip .lbl { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chip .val { font-size: 32px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip .sub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; min-height: 18px; font-weight: 500; }
.chip.slot { border-style: dashed; border-color: var(--line); }
.chip.slot.filled { border-style: solid; border-color: var(--torch); background: rgba(255,139,61,.08); }
.chip.armed { animation: arm 1s ease-in-out infinite; }
@keyframes arm { 50% { border-color: var(--torch); background: rgba(255,139,61,.10); } }
.chip .bar { position: absolute; left: 8px; right: 8px; bottom: 4px; height: 3px; background: var(--line-dim); border-radius: 2px; overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--torch); transition: width .3s; }

.die { position: relative; width: 48px; height: 48px; flex: none; padding: 7px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); background: var(--chalk); border: 0; border-radius: 10px; box-shadow: 0 3px 0 #9bb6d6; transition: transform .15s; }
.die i { border-radius: 50%; background: transparent; margin: 14%; }
.die i.on { background: var(--card); }
.die.sel { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--torch), 0 6px 0 #9bb6d6; }
.die.used { opacity: .25; pointer-events: none; }
.die.mini { width: 20px; height: 20px; padding: 3px; border-radius: 4px; box-shadow: none; }
.die.mini i { margin: 8%; }
.die.rolling { animation: tumble .12s linear infinite; }
@keyframes tumble { 25% { transform: rotate(-8deg) translateY(-2px); } 75% { transform: rotate(8deg) translateY(1px); } }
.dice-row { display: flex; gap: 14px; justify-content: center; min-height: 56px; align-items: center; }
.dice-row .hint { color: var(--muted); font-size: 15px; }

.actions { display: flex; gap: 8px; }
.btn {
  flex: 1; min-height: 50px; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 9px; background: transparent;
  font-weight: 700; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk);
}
.btn.primary { background: var(--torch); border-color: var(--torch); color: #1a0d03; }
.btn.small { flex: none; padding: 8px 16px; font-size: 17px; letter-spacing: .06em; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.pulse:not(:disabled) { animation: arm 1s ease-in-out infinite; }
.log { margin: 0; min-height: 40px; color: var(--muted); font-size: 16px; }
.log b { color: var(--chalk); font-weight: 600; }

/* ---- hojas y diálogos ---- */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(3,8,18,.78); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.sheet {
  width: 100%; max-width: 440px; max-height: 88%; overflow: auto; background: var(--card); border: 1.5px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0;
  padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px); display: flex; flex-direction: column; gap: 12px;
  animation: rise .28s ease-out;
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; }
.sheet p { margin: 0; color: var(--chalk); }
.sheet .lead { color: var(--muted); }
.sheet h4 { margin: 6px 0 0; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--torch); font-weight: 700; }
.sheet ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.sheet .fine { font-size: 14px; color: var(--muted); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 64px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: rgba(127,168,220,.06); text-align: left; }
.choice b { font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.choice span { font-size: 15px; color: var(--muted); }
.choice span em { font-style: normal; color: var(--torch); font-weight: 700; }
.choice.wide { grid-column: 1 / -1; border-color: var(--torch); }
.choice:disabled { opacity: .4; }

@media (max-width: 360px) {
  .brand .mark { font-size: 29px; } .chip .val { font-size: 28px; } .die { width: 44px; height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

.btn.mini { flex: none; min-height: 44px; padding: 6px 12px; font-size: 16px; letter-spacing: .05em; }
.actions .btn.mini { flex: 1; }
.sheet > * { flex-shrink: 0; }
.btn.abil { border-color: var(--torch); color: var(--torch); background: rgba(255,139,61,.08); }
.chip.locked::after { content: 'fijo'; position: absolute; top: 3px; right: 6px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.die.locked { box-shadow: 0 0 0 3px var(--line), 0 3px 0 #9bb6d6; }
.hp-row .lab { width: auto; min-width: 44px; color: var(--torch); }

/* ---- pantallas de inicio ---- */
.screen { display: none; }
body.menu .app { display: none; }
body.menu .screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100dvh; padding: max(18px, env(safe-area-inset-top)) 16px calc(env(safe-area-inset-bottom) + 22px);
}
.splash { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
.splash .logo { display: flex; flex-direction: column; line-height: .85; margin-bottom: 2px; }
.splash .logo .mark { font-family: var(--display); font-size: 68px; }
.splash .logo .sub { font-size: 16px; letter-spacing: .4em; text-transform: uppercase; color: var(--torch); font-weight: 600; margin-top: 6px; }
.tagline { margin: 0; color: var(--muted); font-size: 19px; }
.splash .lead { margin: 0; color: var(--muted); }
.splash .fine { margin: 0; font-size: 14px; color: var(--muted); }
.menu-btns { display: flex; flex-direction: column; gap: 10px; margin: 6px 0; }
.menu-btns .btn, .menu-main { flex: none; min-height: 60px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; text-align: left; }
.menu-main small { font-size: 14px; letter-spacing: .08em; opacity: .75; font-weight: 600; }
.menu-btns .ghost { align-self: flex-start; }
.screen-h { margin: 0; font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; }
.back { align-self: flex-start; }
.hero-list { display: flex; flex-direction: column; gap: 10px; }
.hero-card { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; text-align: left; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: rgba(127,168,220,.06); }
.hero-card:active, .hero-card:hover { border-color: var(--torch); background: rgba(255,139,61,.08); }
.hero-card .ico { width: 58px; height: 58px; color: var(--torch); border: 1.5px solid var(--line-dim); border-radius: 10px; display: grid; place-items: center; }
.hero-card .ico svg { width: 68%; height: 68%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.hero-card b { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; }
.hero-card p { margin: 3px 0 0; color: var(--muted); font-size: 16px; line-height: 1.2; }
.pw {
  width: 100%; text-align: center; text-transform: uppercase; letter-spacing: .35em; padding: 12px 0 12px .35em;
  background: rgba(127,168,220,.06); border: 1.5px solid var(--line); border-radius: 10px; color: var(--chalk);
  font: 700 44px/1.1 ui-monospace, Menlo, Consolas, monospace;
}
.pw::placeholder { color: var(--line-dim); }
.pw:focus-visible { outline: 2px solid var(--torch); outline-offset: 2px; }
.err { margin: 0; min-height: 22px; color: var(--foe); font-size: 16px; }
.pwshow { display: flex; gap: 8px; justify-content: center; }
.pwshow span { width: 58px; height: 76px; display: grid; place-items: center; border: 1.5px solid var(--torch); border-radius: 10px; background: rgba(255,139,61,.08); color: var(--torch); font: 700 42px/1 ui-monospace, Menlo, Consolas, monospace; }
@media (max-width: 380px) {
  .pwshow span { width: 50px; height: 68px; font-size: 36px; }
}

/* cabecera compacta: marca y dos botones en una sola línea */
.top { flex-wrap: nowrap; }
.brand { flex: none; }
.brand .mark { font-size: 31px; }
.brand .sub { white-space: nowrap; letter-spacing: .2em; font-size: 12px; }
.top-actions { gap: 6px; min-width: 0; }
.top-actions .ghost { padding: 7px 10px; font-size: 14px; letter-spacing: .05em; min-height: 36px; }

/* ---- animaciones al moverse ---- */
.token svg { scale: var(--flip, 1) 1; }
.token.walking svg { animation: walk .5s ease-in-out infinite; transform-origin: 50% 85%; }
.token.adv.walking svg { animation: walk .21s ease-in-out infinite; }
.token.k-spider.walking svg { animation: skitter .24s linear infinite; }
.token.k-skeleton.walking svg { animation: clatter .45s ease-in-out infinite; }
.token.k-orc.walking svg { animation: stomp .9s ease-in-out infinite; }
.token.k-demon.walking svg { animation: hover 1.1s ease-in-out infinite; }
@keyframes walk { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-12%) rotate(-5deg); } 50% { transform: translateY(0) rotate(0); } 75% { transform: translateY(-12%) rotate(5deg); } }
@keyframes skitter { 0%,100% { transform: translate(0,0) scaleY(1); } 25% { transform: translate(-4%,3%) scaleY(.94); } 50% { transform: translate(3%,-2%) scaleY(1.04); } 75% { transform: translate(-3%,-3%) scaleY(.97); } }
@keyframes clatter { 0%,100% { transform: translateY(0) rotate(-8deg); } 25% { transform: translateY(-8%) rotate(0); } 50% { transform: translateY(0) rotate(8deg); } 75% { transform: translateY(-8%) rotate(0); } }
@keyframes stomp { 0%,100% { transform: translateY(0) scale(1.08,.92); } 35% { transform: translateY(-16%) scale(.96,1.06); } 60% { transform: translateY(0) scale(1.08,.92); } }
@keyframes hover { 0%,100% { transform: translateY(-3%) scale(1); } 50% { transform: translateY(-14%) scale(1.05); } }
.token.adv.walking { z-index: 4; }

/* ---- texto flotante: BLOCK con el mismo tamaño y sitio que el daño ---- */
.float { display: flex; justify-content: center; white-space: nowrap; }
.float.block { color: var(--line); }
.token.blocked svg { animation: guard .6s ease-out; }
@keyframes guard { 0% { filter: drop-shadow(0 0 0 rgba(127,168,220,0)); } 30% { filter: drop-shadow(0 0 9px #7fa8dc); } 100% { filter: drop-shadow(0 0 6px rgba(255,139,61,.55)); } }

</style>
</head>
<body>
<div class="screen" id="screen"></div>
<main class="app">
  <header class="top">
    <div class="brand"><span class="mark">Dungeon</span><span class="sub">in one card</span></div>
    <div class="top-actions">
      <button type="button" class="ghost" id="btnRules">Reglas</button>
      <button type="button" class="ghost" id="btnPass">Contraseña</button>
    </div>
  </header>

  <section class="card-wrap">
    <article class="card" id="card">
      <div class="card-head">
        <div class="head-row">
          <div class="lvl-num">Nivel <b id="lvlNum">1</b> de 12</div>
          <div class="dots" id="dots" aria-hidden="true"></div>
        </div>
        <h2 class="lvl-name" id="lvlName">Sótano de telarañas</h2>
      </div>
      <div class="board-box" id="boxBoard">
        <div class="board" id="board">
          <div class="grid" id="grid"></div>
          <div class="tokens" id="tokens"></div>
        </div>
      </div>
      <div class="foot" id="foot"></div>
    </article>
  </section>

  <section class="panel" aria-label="Mandos">
    <div class="banner"><span class="step" id="step">1</span><p id="bannerText"></p></div>
    <div class="hp-row"><span class="lab" id="heroTag"></span><div class="pips" id="pips"></div><span class="hpnum" id="hpnum"></span></div>
    <div class="chips" id="chips"></div>
    <div class="dice-row" id="diceRow"></div>
    <div class="actions" id="actions"></div>
    <p class="log" id="log" aria-live="polite"></p>
  </section>
</main>
<script>
'use strict';
/* ===== MOTOR DEL JUEGO (sin DOM) ===== */
const COLS = 5, ROWS = 5, N = COLS * ROWS;
const idx = (x, y) => y * COLS + x;
const XY = i => [i % COLS, (i / COLS) | 0];
// [dx, dy, coste de Movimiento]: recto 2, diagonal 3
const DIRS = [[1,0,2],[-1,0,2],[0,1,2],[0,-1,2],[1,1,3],[1,-1,3],[-1,1,3],[-1,-1,3]];
const START_HP = 6;

/* Datos transcritos de la carta original (cuatro orientaciones).
   '#' muro, 'S' escalera de entrada (la de abajo), 'U' la otra escalera (se puede pisar). */
const ORIENTS = {
  spider:   { mon: { key: 'spider',   name: 'Araña',     plural: 'Arañas',      hp: 2, spd: 5, atk: 4, def: 4, rng: 3 },
              map: ['....U', '...#.', '.....', '.#.#.', 'S....'] },
  skeleton: { mon: { key: 'skeleton', name: 'Esqueleto', plural: 'Esqueletos',  hp: 3, spd: 4, atk: 5, def: 4, rng: 4 },
              map: ['U....', '.....', '#..#.', '...#.', '....S'] },
  orc:      { mon: { key: 'orc',      name: 'Orco',      plural: 'Orcos',       hp: 5, spd: 3, atk: 7, def: 7, rng: 2 },
              map: ['....U', '.#.#.', '.....', '.#...', 'S....'] },
  demon:    { mon: { key: 'demon',    name: 'Demonio',   plural: 'Demonios',    hp: 5, spd: 5, atk: 5, def: 5, rng: 5 },
              map: ['U....', '.#...', '.#..#', '.....', '....S'] }
};
// Casillas de salida de los monstruos por nivel: [columna, fila]
const LEVEL_DEFS = [
  { title: 'Telarañas',            o: 'spider',   at: [[3,0],[4,2]] },
  { title: 'Osario',               o: 'skeleton', at: [[2,0],[0,1]] },
  { title: 'Cubil del orco',       o: 'orc',      at: [[4,1]] },
  { title: 'Puerta del demonio',   o: 'demon',    at: [[1,0]] },
  { title: 'Telarañas II',         o: 'spider',   at: [[1,0],[4,1],[4,4]] },
  { title: 'Osario II',            o: 'skeleton', at: [[1,0],[1,1],[0,4]] },
  { title: 'Cubil del orco II',    o: 'orc',      at: [[2,1],[4,3]] },
  { title: 'Puerta del demonio II',o: 'demon',    at: [[3,0],[1,4]] },
  { title: 'Telarañas III',        o: 'spider',   at: [[0,0],[2,2],[4,3],[2,4]] },
  { title: 'Osario III',           o: 'skeleton', at: [[4,0],[2,1],[1,2],[0,3]] },
  { title: 'Cubil del orco III',   o: 'orc',      at: [[1,0],[3,0],[4,2]] },
  { title: 'Puerta del demonio III', o: 'demon',  at: [[0,1],[2,1],[0,3]] }
];

function buildLevel(def) {
  const O = ORIENTS[def.o];
  const walls = new Array(N).fill(false);
  const stairs = [];
  let start = -1;
  O.map.forEach((row, y) => {
    for (let x = 0; x < COLS; x++) {
      const c = row[x], i = idx(x, y);
      if (c === '#') walls[i] = true;
      else if (c === 'S') { start = i; stairs.push(i); }
      else if (c === 'U') stairs.push(i);
    }
  });
  const spawns = def.at.map(([x, y]) => idx(x, y));
  return { title: def.title, mon: O.mon, map: O.map, walls, start, stairs, spawns, rd: {}, lm: {} };
}
const LEVELS = LEVEL_DEFS.map(buildLevel);

/* ---------- Caminos y distancias ---------- */
function neighbors(lv, i, cut) {
  const [x, y] = XY(i), out = [];
  for (const [dx, dy, c] of DIRS) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
    const j = idx(nx, ny);
    if (lv.walls[j]) continue;
    // Una diagonal "corta la esquina": queda cerrada si las dos casillas contiguas (la horizontal y la
    // vertical) son impasables. Los muros siempre lo son; para los monstruos también el aventurero (cut).
    // Otros monstruos no cierran el paso.
    if (c === 3) {
      const h = idx(x + dx, y), v = idx(x, y + dy);
      if ((lv.walls[h] || (cut && cut[h])) && (lv.walls[v] || (cut && cut[v]))) continue;
    }
    out.push([j, c]);
  }
  return out;
}

function dijkstra(lv, src, blocked, cut) {
  const dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), done = new Array(N).fill(false);
  dist[src] = 0;
  for (;;) {
    let u = -1, b = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < b) { b = dist[i]; u = i; }
    if (u < 0) break;
    done[u] = true;
    for (const [v, c] of neighbors(lv, u, cut)) {
      if (blocked && blocked[v]) continue;
      if (b + c < dist[v]) { dist[v] = b + c; prev[v] = u; }
    }
  }
  return { dist, prev };
}

// Distancia de Alcance: menor coste de Movimiento entre dos casillas (solo los muros estorban)
function rangeDist(lv, a, b) {
  let d = lv.rd[a];
  if (!d) d = lv.rd[a] = dijkstra(lv, a, null).dist;
  return d[b];
}

/* ---------- Línea de visión ---------- */
// ¿El segmento comparte longitud positiva con la casilla cerrada (sx,sy)?
// Línea de visión: el segmento puede salir de cualquier punto de la casilla de origen y llegar a
// cualquier punto de la casilla de destino. Un muro u otro monstruo lo bloquea aunque lo roce solo
// con una esquina o un borde (un único punto): el cuadrado se trata como cerrado.
const LOS_PTS = [0.02, 0.2, 0.5, 0.8, 0.98];

function segTouches(ax, ay, bx, by, sx, sy) {
  const dx = bx - ax, dy = by - ay;
  let lo = 0, hi = 1;
  if (dx === 0) { if (ax < sx || ax > sx + 1) return false; }
  else {
    let t1 = (sx - ax) / dx, t2 = (sx + 1 - ax) / dx;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    lo = Math.max(lo, t1); hi = Math.min(hi, t2);
  }
  if (dy === 0) { if (ay < sy || ay > sy + 1) return false; }
  else {
    let t1 = (sy - ay) / dy, t2 = (sy + 1 - ay) / dy;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    lo = Math.max(lo, t1); hi = Math.min(hi, t2);
  }
  return hi - lo >= -1e-9;
}

// Segmentos de a a b que no tocan ningún muro (lista plana p,q,r,s,...)
function losSegs(lv, a, b) {
  const key = a * N + b;
  if (lv.lm[key] !== undefined) return lv.lm[key];
  const [ax, ay] = XY(a), [bx, by] = XY(b), walls = [], out = [];
  for (let w = 0; w < N; w++) if (lv.walls[w] && w !== a && w !== b) walls.push(XY(w));
  for (const u of LOS_PTS) for (const v of LOS_PTS) for (const x of LOS_PTS) for (const y of LOS_PTS) {
    const p = ax + u, q = ay + v, r = bx + x, s = by + y;
    let ok = true;
    for (const [wx, wy] of walls) if (segTouches(p, q, r, s, wx, wy)) { ok = false; break; }
    if (ok) out.push(p, q, r, s);
  }
  lv.lm[key] = out;
  return out;
}

function hasLOS(lv, a, b, blockers) {
  if (a === b) return true;
  const segs = losSegs(lv, a, b);
  if (!segs.length) return false;
  const bl = blockers.filter(t => t !== a && t !== b).map(XY);
  if (!bl.length) return true;
  for (let k = 0; k < segs.length; k += 4) {
    let ok = true;
    for (const [tx, ty] of bl) if (segTouches(segs[k], segs[k + 1], segs[k + 2], segs[k + 3], tx, ty)) { ok = false; break; }
    if (ok) return true;
  }
  return false;
}

/* ---------- Estado ---------- */
const HERO_KEYS = ['paladin', 'barbarian', 'ranger', 'mage'];

function freshTurn() {
  return { dice: null, assign: { spd: -1, atk: -1, def: -1, rng: -1 }, sel: -1, lock: -1, ranger: false, rerolled: false,
           spd: 0, atk: 0, def: 0, rng: 0, spdLeft: 0, atkLeft: 0 };
}

function setupLevel(st, i) {
  const lv = LEVELS[i];
  st.levelIdx = i;
  const [x, y] = XY(lv.start);
  st.adv.x = x; st.adv.y = y;
  st.mons = lv.spawns.map((s, n) => {
    const [mx, my] = XY(s);
    const m = lv.mon;
    return { id: n + 1, x: mx, y: my, hp: m.hp, maxHp: m.hp, spd: m.spd, atk: m.atk, def: m.def, rng: m.rng };
  });
  st.phase = 'energy';
  st.turn = freshTurn();
  st.undo = [];
  st.turnNo = 1;
  st.cp = { hp: st.adv.hp };   // Vida al empezar el nivel (para la contraseña)
  st.abil = false;             // habilidad de héroe usada en este nivel
  return st;
}

function newRun(hero) {
  const st = { hero: HERO_KEYS.includes(hero) ? hero : 'paladin', levelIdx: 0,
               adv: { x: 0, y: 0, hp: START_HP, spd: 1, atk: 1, def: 1, rng: 2 },
               mons: [], phase: 'energy', turn: null, undo: [], turnNo: 1, prev: null };
  return setupLevel(st, 0);
}

const rollDie = (rnd = Math.random) => 1 + Math.floor(rnd() * 6);
const rollDice = (rnd = Math.random) => [rollDie(rnd), rollDie(rnd), rollDie(rnd)];

function assignComplete(t) {
  return (t.ranger ? t.assign.rng : t.assign.spd) >= 0 && t.assign.atk >= 0 && t.assign.def >= 0;
}

function confirmEnergy(st) {
  const t = st.turn, a = st.adv;
  const d = k => (t.assign[k] >= 0 ? t.dice[t.assign[k]] : 0);
  t.spd = a.spd + d('spd'); t.atk = a.atk + d('atk'); t.def = a.def + d('def'); t.rng = a.rng + d('rng');
  t.spdLeft = t.spd; t.atkLeft = t.atk;
  t.sel = -1;
  const pv = {};
  for (const k of ['spd', 'atk', 'def', 'rng']) if (t.assign[k] >= 0) pv[k] = t.dice[t.assign[k]];
  st.prev = pv;
  st.phase = 'move';
  st.undo = [];
}

/* ---------- Habilidades de héroe ---------- */
function rerollDice(st) {
  const t = st.turn;
  t.dice = rollDice();
  t.assign = { spd: -1, atk: -1, def: -1, rng: -1 };
  t.sel = -1; t.lock = -1; t.ranger = false;
}
function useReroll(st) { if (st.hero === 'mage') st.abil = true; else st.turn.rerolled = true; rerollDice(st); }
function rollWithKeep(st, k) { // Paladín: conserva el dado que tenía la ranura k el turno anterior
  const t = st.turn;
  t.dice = rollDice(); t.dice[0] = st.prev[k]; t.assign[k] = 0; t.lock = k; st.abil = true;
}
function toggleRanger(st) {
  const t = st.turn;
  if (!t.ranger) { t.ranger = true; st.abil = true; t.assign.spd = -1; }
  else { t.ranger = false; st.abil = false; t.assign.rng = -1; }
}
function abilityInfo(st) {
  const t = st.turn;
  if (st.phase !== 'energy') return null;
  if (st.hero === 'paladin') return !t.dice && !st.abil && st.prev && Object.keys(st.prev).length ? { id: 'keep', label: 'Conservar dado' } : null;
  if (st.hero === 'barbarian') return t.dice && !t.rerolled && st.adv.hp === 1 ? { id: 'reroll', label: 'Volver a tirar' } : null;
  if (st.hero === 'mage') return t.dice && !st.abil ? { id: 'reroll', label: 'Volver a tirar' } : null;
  if (st.hero === 'ranger') return t.dice && (t.ranger || !st.abil) ? { id: 'ranger', label: t.ranger ? 'Dado al Mov' : 'Dado al Alcance' } : null;
  return null;
}

/* ---------- Fase del aventurero ---------- */
function reachFromAdv(st) {
  const lv = LEVELS[st.levelIdx];
  const blocked = new Array(N).fill(false);
  for (const m of st.mons) blocked[idx(m.x, m.y)] = true;
  return dijkstra(lv, idx(st.adv.x, st.adv.y), blocked);
}

function attackInfo(st, m) {
  const lv = LEVELS[st.levelIdx], a = idx(st.adv.x, st.adv.y), t = idx(m.x, m.y);
  const rd = rangeDist(lv, a, t);
  if (rd > (st.turn.rng || st.adv.rng)) return { ok: false, why: 'range', rd };
  const others = st.mons.filter(o => o !== m).map(o => idx(o.x, o.y));
  if (!hasLOS(lv, a, t, others)) return { ok: false, why: 'los', rd };
  if (st.turn.atkLeft < m.def) return { ok: false, why: 'points', rd };
  return { ok: true, rd };
}

function pushUndo(st) {
  st.undo.push(JSON.stringify({ x: st.adv.x, y: st.adv.y, mons: st.mons,
                                spdLeft: st.turn.spdLeft, atkLeft: st.turn.atkLeft }));
}
function popUndo(st) {
  const s = JSON.parse(st.undo.pop());
  st.adv.x = s.x; st.adv.y = s.y; st.mons = s.mons;
  st.turn.spdLeft = s.spdLeft; st.turn.atkLeft = s.atkLeft;
}

function moveAdv(st, i, dist) {
  pushUndo(st);
  const [x, y] = XY(i);
  st.turn.spdLeft -= dist;
  st.adv.x = x; st.adv.y = y;
}

// devuelve true si el monstruo muere
function attackMon(st, m) {
  pushUndo(st);
  st.turn.atkLeft -= m.def;
  m.hp -= 1;
  if (m.hp <= 0) { st.mons = st.mons.filter(o => o !== m); return true; }
  return false;
}

/* ---------- Fase de los monstruos ---------- */
function walkToward(D, me, target, spd, others) {
  const path = [];
  for (let c = target; c !== -1; c = D.prev[c]) path.push(c);
  path.reverse();
  let last = 0;
  for (let k = 1; k < path.length; k++) { if (D.dist[path[k]] <= spd) last = k; else break; }
  while (last > 0 && others.includes(path[last])) last--;
  return path[last];
}

function chooseMove(lv, st, m) {
  const advI = idx(st.adv.x, st.adv.y), me = idx(m.x, m.y);
  const others = st.mons.filter(o => o !== m).map(o => idx(o.x, o.y));
  const blocked = new Array(N).fill(false);
  blocked[advI] = true;
  const D = dijkstra(lv, me, blocked, blocked);
  const free = i => !lv.walls[i] && i !== advI && !others.includes(i) && D.dist[i] < Infinity;
  const R = m.rng;
  let target = -1, bestCost = Infinity;
  // 1) casilla a Alcance máximo, con visión, la más cercana al monstruo
  for (let i = 0; i < N; i++) {
    if (free(i) && rangeDist(lv, i, advI) === R && D.dist[i] < bestCost && hasLOS(lv, i, advI, others)) {
      bestCost = D.dist[i]; target = i;
    }
  }
  // 2) si no hay, la de mayor Alcance posible con visión
  if (target < 0) {
    let bestRd = -1; bestCost = Infinity;
    for (let i = 0; i < N; i++) {
      if (!free(i)) continue;
      const rd = rangeDist(lv, i, advI);
      if (rd > R || !hasLOS(lv, i, advI, others)) continue;
      if (rd > bestRd || (rd === bestRd && D.dist[i] < bestCost)) { bestRd = rd; bestCost = D.dist[i]; target = i; }
    }
  }
  if (target >= 0) return walkToward(D, me, target, m.spd, others);
  // 3) acercarse todo lo posible
  let best = me, bestD = rangeDist(lv, me, advI), bestC = 0;
  for (let i = 0; i < N; i++) {
    if (!free(i) || D.dist[i] > m.spd) continue;
    const d = rangeDist(lv, i, advI);
    if (d < bestD || (d === bestD && D.dist[i] < bestC)) { best = i; bestD = d; bestC = D.dist[i]; }
  }
  return best;
}

function attackers(st) {
  const lv = LEVELS[st.levelIdx], advI = idx(st.adv.x, st.adv.y);
  return st.mons.filter(m => {
    const me = idx(m.x, m.y);
    if (rangeDist(lv, me, advI) > m.rng) return false;
    return hasLOS(lv, me, advI, st.mons.filter(o => o !== m).map(o => idx(o.x, o.y)));
  });
}

// Muta el estado y devuelve los eventos para animarlos
function playMonsters(st) {
  const lv = LEVELS[st.levelIdx], advI = idx(st.adv.x, st.adv.y), ev = [];
  const order = st.mons.slice().sort((a, b) =>
    rangeDist(lv, advI, idx(a.x, a.y)) - rangeDist(lv, advI, idx(b.x, b.y)) || a.id - b.id);
  for (const m of order) {
    const from = idx(m.x, m.y), to = chooseMove(lv, st, m);
    if (to !== from) {
      // camino casilla a casilla (el mismo que calcula chooseMove) para animarlo
      const bl = new Array(N).fill(false); bl[advI] = true;
      const D = dijkstra(lv, from, bl, bl), path = [];
      for (let c = to; c !== -1; c = D.prev[c]) path.push(c);
      path.reverse();
      const [x, y] = XY(to); m.x = x; m.y = y;
      ev.push({ t: 'move', id: m.id, from, to, path });
    }
  }
  const att = attackers(st);
  const total = att.reduce((s, m) => s + m.atk, 0);
  const dmg = Math.floor(total / st.turn.def);
  st.adv.hp = Math.max(0, st.adv.hp - dmg);
  ev.push({ t: 'attack', ids: att.map(m => m.id), total, def: st.turn.def, dmg });
  return ev;
}

function endTurnCleanup(st) {
  st.phase = st.adv.hp <= 0 ? 'dead' : 'energy';
  st.turn = freshTurn();
  st.undo = [];
  st.turnNo++;
}

/* ---------- Entre niveles ---------- */
function levelCleared(st) { return st.mons.length === 0; }
function applyBreak(st, choice) { // 'spd' | 'atk' | 'def' | 'rng' | 'heal'
  if (choice === 'heal') st.adv.hp = START_HP; else st.adv[choice] += 1;
}
function nextLevel(st) {
  if (st.levelIdx >= LEVELS.length - 1) { st.phase = 'won'; return false; }
  setupLevel(st, st.levelIdx + 1);
  return true;
}

/* ---------- Contraseña de 4 caracteres (inicio de nivel) ---------- */
const PW_ALPHA = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   // 32 símbolos, sin 0 1 I O
const PW_MOD = 1 << 20, PW_A = 618033, PW_B = 0x5A3C1;
const PW_PAIRS = [], PW_INDEX = new Map();
for (let L = 0; L < 12; L++)
  for (let a = 0; a <= L; a++) for (let b = 0; a + b <= L; b++)
    for (let c = 0; a + b + c <= L; c++) for (let d = 0; a + b + c + d <= L; d++) {
      PW_INDEX.set([L, a, b, c, d].join(), PW_PAIRS.length);
      PW_PAIRS.push([L, a, b, c, d]);
    }
const PW_N = PW_PAIRS.length;                          // 4368 (nivel + mejoras posibles)
const PW_TOTAL = HERO_KEYS.length * 6 * PW_N;          // héroe × vida × (nivel+mejoras)
function modInv(a, m) {
  let r0 = m, r1 = a % m, t0 = 0, t1 = 1;
  while (r1) { const q = Math.floor(r0 / r1); [r0, r1] = [r1, r0 - q * r1]; [t0, t1] = [t1, t0 - q * t1]; }
  return ((t0 % m) + m) % m;
}
const PW_AINV = modInv(PW_A, PW_MOD);
const pwCheck = n => (n ^ (n >> 3) ^ (n >> 7) ^ (n >> 11) ^ (n >> 15)) & 7;

function fromCheckpoint(hero, L, hp, u) {
  const st = newRun(hero);
  st.adv.hp = hp; st.adv.spd = 1 + u[0]; st.adv.atk = 1 + u[1]; st.adv.def = 1 + u[2]; st.adv.rng = 2 + u[3];
  return setupLevel(st, L);
}
const upgradesOf = st => [st.adv.spd - 1, st.adv.atk - 1, st.adv.def - 1, st.adv.rng - 2];

function encodePassword(st) {
  const pi = PW_INDEX.get([st.levelIdx].concat(upgradesOf(st)).join());
  const hp = st.cp ? st.cp.hp : st.adv.hp;
  if (pi === undefined || hp < 1 || hp > START_HP) return null;
  const n = ((HERO_KEYS.indexOf(st.hero) * 6 + (hp - 1)) * PW_N) + pi;
  let p = ((n * 8 + pwCheck(n)) * PW_A + PW_B) % PW_MOD;
  let out = '';
  for (let i = 0; i < 4; i++) { out = PW_ALPHA[p & 31] + out; p >>= 5; }
  return out;
}

function decodePassword(text) {
  const s = String(text).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.length !== 4) return null;
  let p = 0;
  for (const ch of s) { const v = PW_ALPHA.indexOf(ch); if (v < 0) return null; p = p * 32 + v; }
  const raw = ((((p - PW_B) % PW_MOD) + PW_MOD) % PW_MOD * PW_AINV) % PW_MOD;
  if (raw >= PW_TOTAL * 8) return null;
  const n = raw >> 3;
  if ((raw & 7) !== pwCheck(n)) return null;
  const [L, a, b, c, d] = PW_PAIRS[n % PW_N];
  const rest = Math.floor(n / PW_N);
  return fromCheckpoint(HERO_KEYS[Math.floor(rest / 6)], L, (rest % 6) + 1, [a, b, c, d]);
}

      <h4>Contraseña</h4>
      <p>Cada nivel empieza con una contraseña de 4 letras o números (botón <b>Contraseña</b>). Anótala: desde el menú, «Continuar con contraseña» te devuelve al inicio de ese nivel con tu héroe, tu Vida y tus mejoras de ese momento. No guarda el turno en curso.</p>
      <p class="fine">Versión web no oficial del juego solitario One Card Dungeon, de Barny Skinner. Los mapas, las cifras de los monstruos y su aparición por nivel siguen la carta original; las ilustraciones y los textos son propios. Si te gusta, apoya al autor y consigue el juego.</p>
      <button type="button" class="btn primary" id="x">Entendido</button>`, [['#x', closeSheet]], true);
  }

  function breakSheet() {
    const a = G.adv;
    const ch = ['spd', 'atk', 'def', 'rng'].map(k =>
      `<button type="button" class="choice" data-c="${k}"><b>${LONG[k]}</b><span><em>${a[k]}</em> → <em>${a[k] + 1}</em></span></button>`).join('');
    const full = a.hp >= START_HP;
    openSheet(`<h3>Nivel superado</h3>
      <p class="lead">Descansa un momento. Elige una sola cosa.</p>
      <div class="choices">${ch}
        <button type="button" class="choice wide" data-c="heal" ${full ? 'disabled' : ''}><b>Curarte</b><span>Vida <em>${a.hp}</em> → <em>${START_HP}</em></span></button>
      </div>`, [], false);
    document.querySelectorAll('#veil .choice').forEach(b => b.addEventListener('click', () => chooseBreak(b.dataset.c)));
  }

  function deathSheet() {
    noteBest();
    const n = G.levelIdx + 1, pw = E.encodePassword(G);
    openSheet(`<h3>Has caído</h3>
      <p class="lead">Llegaste al nivel ${n} de ${LEVELS.length} en ${G.totalTurns} turnos. Tu mejor marca es el nivel ${bestLevel}.</p>
      <p>Puedes reintentar el nivel ${n} tal como lo empezaste${pw ? `: contraseña <b>${pw}</b>` : ''}.</p>
      <button type="button" class="btn primary" id="retry">Reintentar nivel ${n}</button>
      <button type="button" class="btn" id="menu">Ir al menú</button>`,
      [['#retry', retry], ['#menu', goMenu]], false);
  }

  function winSheet() {
    noteBest();
    openSheet(`<h3>Cáliz de Brasas</h3>
      <p class="lead">Los tres demonios han caído y el cáliz es tuyo. Superaste los 12 niveles como ${HEROES[G.hero].name} en ${G.totalTurns} turnos con ${G.adv.hp} de Vida.</p>
      <button type="button" class="btn primary" id="menu">Ir al menú</button>`, [['#menu', goMenu]], false);
  }

  /* ---------- pantallas de inicio ---------- */
  function showScreen(html, binds) {
    closeSheet();
    const sc = $('#screen');
    sc.innerHTML = html;
    document.body.classList.add('menu');
    window.scrollTo(0, 0);
    for (const [sel, fn] of binds || []) { const el = sc.querySelector(sel); if (el) el.addEventListener('click', fn); }
    return sc;
  }
  function hideScreen() { document.body.classList.remove('menu'); $('#screen').innerHTML = ''; fit(); }

  const LOGO = '<div class="logo"><span class="mark">Dungeon</span><span class="sub">in one card</span></div>';

  function menuScreen() {
    G = null; busy = false; rolling = false;
    const sv = loadSaved();
    showScreen(`<div class="splash">${LOGO}
      <p class="tagline">Una carta, doce niveles y tres dados.</p>
      <div class="menu-btns">
        ${sv ? `<button type="button" class="btn primary menu-main" id="mContinue"><span>Seguir en este dispositivo</span><small>${HEROES[sv.hero].name} · nivel ${sv.levelIdx + 1} · Vida ${sv.adv.hp}</small></button>` : ''}
        <button type="button" class="btn ${sv ? '' : 'primary'} menu-main" id="mNew"><span>Nueva partida</span></button>
        <button type="button" class="btn menu-main" id="mPass"><span>Continuar con contraseña</span><small>4 letras o números</small></button>
        <button type="button" class="ghost" id="mRules">Cómo se juega</button>
      </div>
      <p class="fine">Versión no oficial de One Card Dungeon, de Barny Skinner.</p></div>`,
      [['#mContinue', () => resume(sv)], ['#mNew', heroScreen], ['#mPass', () => passScreen('')], ['#mRules', rulesSheet]]);
  }

  function heroScreen() {
    const sc = showScreen(`<div class="splash">
      <button type="button" class="ghost back" id="back">‹ Atrás</button>
      <h2 class="screen-h">Elige a tu héroe</h2>
      <div class="hero-list">${HERO_KEYS.map(k => `<button type="button" class="hero-card" data-hero="${k}">
        <span class="ico">${HERO_ICONS[k]}</span><span><b>${HEROES[k].name}</b><p>${HEROES[k].txt}</p></span></button>`).join('')}</div></div>`,
      [['#back', menuScreen]]);
    sc.querySelectorAll('[data-hero]').forEach(b => b.addEventListener('click', () => startGame(b.dataset.hero)));
  }

  function passScreen(err) {
    const sc = showScreen(`<div class="splash">
      <button type="button" class="ghost back" id="back">‹ Atrás</button>
      <h2 class="screen-h">Contraseña</h2>
      <p class="lead">Escribe la contraseña de 4 letras o números que te dio el juego al empezar un nivel.</p>
      <input id="pwIn" class="pw" type="text" maxlength="4" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="••••" aria-label="Contraseña de 4 caracteres">
      <p class="err" id="pwErr" role="alert">${err || ''}</p>
      <button type="button" class="btn primary" id="pwGo" disabled>Continuar</button>
      <p class="fine">Las contraseñas no usan 0, 1, I ni O, para que no se confundan.</p></div>`,
      [['#back', menuScreen], ['#pwGo', submitPass]]);
    const inp = sc.querySelector('#pwIn'), go = sc.querySelector('#pwGo');
    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
      go.disabled = inp.value.length !== 4;
      $('#pwErr').textContent = '';
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitPass(); });
    if (err) inp.value = '', go.disabled = true;
    setTimeout(() => inp.focus({ preventScroll: true }), 50);
  }

  function submitPass() {
    const inp = $('#pwIn'); if (!inp || inp.value.length !== 4) return;
    const g = E.decodePassword(inp.value);
    if (!g) { $('#pwErr').textContent = 'Esa contraseña no es válida. Revisa las 4 letras o números.'; return; }
    G = g; G.totalTurns = 0; lastHp = G.adv.hp; builtLevel = -1;
    hideScreen(); render();
    say(`<b>Contraseña aceptada.</b> ${HEROES[G.hero].name}, nivel ${G.levelIdx + 1} (${LEVELS[G.levelIdx].title}) con ${G.adv.hp} de Vida. Tira los dados.`);
  }

  function startGame(hero) {
    G = E.newRun(hero); G.totalTurns = 0; lastHp = START_HP; builtLevel = -1;
    hideScreen(); render();
    say(`<b>${HEROES[hero].name}.</b> Una carta, doce niveles. Tira los dados para empezar.`);
  }

  function resume(g) {
    G = g;
    if (G.totalTurns == null) G.totalTurns = 0;
    if (G.phase === 'monsters') G.phase = 'move';
    lastHp = G.adv.hp; builtLevel = -1;
    hideScreen(); render();
    if (G.phase === 'clear') breakSheet();
    else say(G.levelIdx === 0 && G.turnNo === 1 && !G.turn.dice ? 'Una carta, doce niveles. Tira los dados para empezar.' : `Nivel ${G.levelIdx + 1}: ${LEVELS[G.levelIdx].title}.`);
  }

  function goMenu() { if (busy) return; closeSheet(); menuScreen(); }

  function retry() {
    const t = G.totalTurns;
    G = E.retryLevel(G); G.totalTurns = t; lastHp = G.adv.hp; builtLevel = -1;
    closeSheet(); render();
    say(`Reintentas el nivel ${G.levelIdx + 1}: ${LEVELS[G.levelIdx].title}. Tira los dados.`);
  }

  function passwordSheet() {
    if (busy || rolling || !G) return;
    const pw = E.encodePassword(G) || '----';
    const veil = openSheet(`<h3>Contraseña del nivel ${G.levelIdx + 1}</h3>
      <div class="pwshow" role="img" aria-label="Contraseña ${pw.split('').join(' ')}">${[...pw].map(c => `<span>${c}</span>`).join('')}</div>
      <p class="lead">Anótala o cópiala. En el menú, «Continuar con contraseña» te devuelve al inicio de este nivel como ${HEROES[G.hero].name}, con la Vida y las mejoras que tenías al empezarlo. No guarda el turno en curso.</p>
      <p class="fine" id="pwMsg" aria-live="polite"></p>
      <div class="actions"><button type="button" class="btn mini" id="pwCopy">Copiar</button><button type="button" class="btn mini" id="pwMenu">Ir al menú</button></div>
      <button type="button" class="btn primary" id="pwClose">Seguir jugando</button>`,
      [['#pwClose', closeSheet], ['#pwMenu', goMenu], ['#pwCopy', () => {
        const m = $('#pwMsg');
        let p = null;
        try { p = navigator.clipboard && navigator.clipboard.writeText(pw); } catch (e) { p = null; }
        if (p && p.then) p.then(() => { m.textContent = 'Copiada.'; }, () => { m.textContent = 'No se pudo copiar. Anótala a mano.'; });
        else m.textContent = 'No se pudo copiar. Anótala a mano.';
      }]], true);
    return veil;
  }

  function keepSheet() {
    const ks = ['spd', 'atk', 'def'].filter(k => G.prev && G.prev[k] != null);
    const veil = openSheet(`<h3>Conservar un dado</h3>
      <p class="lead">Habilidad del Paladín, una vez por nivel. Elige la habilidad cuyo dado del turno anterior quieres repetir; solo se tiran los otros dos.</p>
      <div class="choices">${ks.map(k => `<button type="button" class="choice" data-k="${k}"><b>${LONG[k]}</b><span>dado <em>${G.prev[k]}</em></span></button>`).join('')}</div>
      <button type="button" class="btn" id="no">Cancelar</button>`, [['#no', closeSheet]], true);
    veil.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.k;
      closeSheet();
      E.rollWithKeep(G, k);
      animateRoll(`Conservas el dado de ${LONG[k]} (<b>${G.turn.dice[0]}</b>). Reparte los otros dos.`);
    }));
  }

  /* ---------- flujo ---------- */
  async function flipTo(fn) {
    const card = $('#card');
    card.classList.add('flip-out');
    await sleep(330);
    fn();
    card.classList.remove('flip-out'); card.classList.add('flip-in');
    await sleep(370);
    card.classList.remove('flip-in');
  }

  async function chooseBreak(c) {
    closeSheet();
    busy = true;
    E.applyBreak(G, c);
    const msg = c === 'heal' ? 'Te curas hasta 6 de Vida.' : `${LONG[c]} sube a ${G.adv[c]}.`;
    noteBest();
    if (G.levelIdx === LEVELS.length - 1) { busy = false; G.phase = 'won'; render(); winSheet(); return; }
    await flipTo(() => { E.nextLevel(G); builtLevel = -1; busy = false; render(); say(`<b>${msg}</b> Nivel ${G.levelIdx + 1}: ${LEVELS[G.levelIdx].title}. Contraseña: <b>${E.encodePassword(G)}</b>`); });
  }

  async function animateRoll(msg) {
    rolling = true;
    render();
    const iv = setInterval(renderDice, 110);
    await sleep(700);
    clearInterval(iv);
    rolling = false;
    render();
    say(msg);
  }

  async function doRoll() {
    if (rolling || G.phase !== 'energy' || G.turn.dice) return;
    G.turn.dice = E.rollDice();
    await animateRoll(G.turn.ranger ? '' : 'Reparte los dados entre Mov, Atq y Def.');
  }

  function onAbility() {
    const ab = E.abilityInfo(G);
    if (!ab || rolling || busy) return;
    if (ab.id === 'keep') keepSheet();
    else if (ab.id === 'reroll') { E.useReroll(G); animateRoll('Vuelves a tirar. Reparte los dados otra vez.'); }
    else if (ab.id === 'ranger') {
      E.toggleRanger(G);
      render();
      say(G.turn.ranger ? 'Habilidad del Ranger: un dado irá a <b>Alc</b> en lugar de Mov.' : 'Habilidad cancelada: vuelve a repartir a Mov, Atq y Def.');
    }
  }

  function onDie(i) {
    const t = G.turn;
    if (G.phase !== 'energy' || rolling) return;
    if (usedDice(t).has(i)) return;
    t.sel = t.sel === i ? -1 : i;
    render();
  }

  function onSlot(k) {
    const t = G.turn;
    if (G.phase !== 'energy' || !t.dice || rolling || !slotKeys(t).includes(k) || t.lock === k) return;
    if (t.sel >= 0) { t.assign[k] = t.sel; t.sel = -1; }
    else if (t.assign[k] >= 0) t.assign[k] = -1;
    else {
      const used = usedDice(t);
      const free = [0, 1, 2].filter(i => !used.has(i));
      if (free.length === 1) t.assign[k] = free[0];
    }
    render();
  }

  function doConfirm() {
    if (!E.assignComplete(G.turn)) return;
    E.confirmEnergy(G);
    render();
    say(`Mov <b>${G.turn.spd}</b> · Atq <b>${G.turn.atk}</b> · Def <b>${G.turn.def}</b>${G.turn.ranger ? ` · Alc <b>${G.turn.rng}</b>` : ''}. ${nothingLeft() ? 'No puedes hacer nada útil: termina el turno.' : ''}`);
  }

  function onTile(i) {
    if (G.phase !== 'move' || busy) return;
    const lv = LEVELS[G.levelIdx];
    if (lv.walls[i]) return;
    const m = G.mons.find(o => idx(o.x, o.y) === i);
    if (m) {
      const info = E.attackInfo(G, m);
      if (!info.ok) {
        if (info.why === 'range') say(`Está a distancia <b>${info.rd}</b> y tu Alcance es <b>${G.turn.rng || G.adv.rng}</b>. Acércate o mejora Alcance.`);
        else if (info.why === 'los') say('Sin línea de visión: un muro u otro monstruo lo tapa.');
        else say(`Te faltan puntos: cada golpe cuesta <b>${m.def}</b> de Atq y te quedan <b>${G.turn.atkLeft}</b>.`);
        return;
      }
      const dead = E.attackMon(G, m);
      floatText(m.x, m.y, dead ? '✕' : '−1', 'good');
      const el = tok.mons.get(m.id); if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 500); }
      render();
      if (E.levelCleared(G)) { levelClear(); return; }
      say(dead ? `<b>${LEVELS[G.levelIdx].mon.name} abatido.</b>` : `Golpe. Le quedan <b>${m.hp}</b> de Vida.`);
      return;
    }
    if (i === idx(G.adv.x, G.adv.y)) return;
    const R = E.reachFromAdv(G);
    if (R.dist[i] > 0 && R.dist[i] <= G.turn.spdLeft) {
      const fx = G.adv.x;
      E.moveAdv(G, i, R.dist[i]);
      if (G.adv.x !== fx) tok.adv.style.setProperty('--flip', G.adv.x < fx ? -1 : 1);
      tok.adv.classList.add('walking');
      clearTimeout(walkTimer); walkTimer = setTimeout(() => tok.adv.classList.remove('walking'), 430);
      render();
      say(`Te mueves. Te quedan <b>${G.turn.spdLeft}</b> de Mov y <b>${G.turn.atkLeft}</b> de Atq.`);
    } else if (R.dist[i] < Infinity) say(`Llegar ahí cuesta <b>${R.dist[i]}</b> de Mov y te quedan <b>${G.turn.spdLeft}</b>.`);
    else say('No hay camino hasta esa casilla.');
  }

  async function levelClear() {
    busy = true;
    G.phase = 'clear';
    noteBest();
    render();
    say('<b>Nivel superado.</b>');
    await sleep(650);
    busy = false;
    breakSheet();
  }

  function undo() {
    if (G.phase !== 'move' || busy || !G.undo.length) return;
    E.popUndo(G);
    render();
    say('Acción deshecha.');
  }

  async function endTurn() {
    if (G.phase !== 'move' || busy) return;
    busy = true;
    G.phase = 'monsters';
    render();
    renderTiles();
    say('Los monstruos se mueven…');
    await sleep(250);
    const ev = E.playMonsters(G);
    for (const e of ev) {
      if (e.t === 'move') {
        const el = tok.mons.get(e.id);
        if (el) {
          // 2 s por casilla en recto, 3 s en diagonal
          el.style.transitionTimingFunction = 'linear';
          el.classList.add('walking');
          for (let k = 1; k < e.path.length; k++) {
            const [px, py] = XY(e.path[k - 1]), [x, y] = XY(e.path[k]);
            const secs = (px !== x && py !== y) ? 3 : 2;
            el.style.transitionDuration = secs + 's';
            if (x !== px) el.style.setProperty('--flip', x < px ? -1 : 1);
            setPos(el, x, y);
            await sleep(secs * 1000);
          }
          el.classList.remove('walking');
          el.style.transitionDuration = ''; el.style.transitionTimingFunction = '';
        }
      } else if (e.t === 'attack') {
        if (e.ids.length) {
          for (const id of e.ids) { const el = tok.mons.get(id); if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 500); } }
          await sleep(350);
          if (e.dmg > 0) {
            floatText(G.adv.x, G.adv.y, '−' + e.dmg, 'dmg');
            tok.adv.classList.add('hurt'); setTimeout(() => tok.adv.classList.remove('hurt'), 500);
          } else {
            floatText(G.adv.x, G.adv.y, 'BLOCK', 'dmg block');
            tok.adv.classList.add('blocked'); setTimeout(() => tok.adv.classList.remove('blocked'), 600);
          }
          renderHP();
          say(`Atacan <b>${e.ids.length}</b>: Ataque total <b>${e.total}</b> ÷ Defensa <b>${e.def}</b> = <b>${e.dmg}</b> de daño.${e.dmg ? '' : ' <b>¡Bloqueado!</b>'}`);
          await sleep(650);
        } else say('Ningún monstruo te alcanza este turno.');
      }
    }
    G.totalTurns++;
    E.endTurnCleanup(G);
    busy = false;
    if (G.phase === 'dead') { render(); deathSheet(); return; }
    render();
    if (!ev.some(e => e.t === 'attack' && e.ids.length)) say('Ningún monstruo te alcanza. Tira los dados.');
  }

  /* ---------- arranque ---------- */
  function wire() {
    $('#grid').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) onTile(+t.dataset.i); });
    $('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) onSlot(c.dataset.k); });
    $('#diceRow').addEventListener('click', e => { const d = e.target.closest('[data-d]'); if (d) onDie(+d.dataset.d); });
    $('#actions').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.id === 'btnRoll') doRoll(); else if (b.id === 'btnConfirm') doConfirm();
      else if (b.id === 'btnAbil') onAbility();
      else if (b.id === 'btnUndo') undo(); else if (b.id === 'btnEnd') endTurn();
    });
    $('#btnRules').addEventListener('click', rulesSheet);
    $('#btnPass').addEventListener('click', passwordSheet);
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('#boxBoard')); else window.addEventListener('resize', fit);
    fit();
  }

  function start(data) {
    loadBest();
    wire();
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (G ? JSON.parse(JSON.stringify(G)) : null));
    if (data && validState(data)) resume(data); else menuScreen();
  }

  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
</body>
</html>
